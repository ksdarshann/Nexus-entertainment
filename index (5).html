/* --- links editor --- */
let linksCtx=null;
function openLinks(target){
  if(!target) return;
  linksCtx={id:target.id, title:target.title||"this title", type:target.type, rows:(target.links||[]).map(l=>({id:l.id,label:l.label,url:l.url}))};
  if(!linksCtx.rows.length) linksCtx.rows.push({id:uid(),label:target.type==="game"?"Store":"Watch",url:""});
  paintLinks(true);
}
function closeLinks(){ linksCtx=null; const r=document.getElementById("linksRoot"); if(r) r.innerHTML=""; }
function rowMsg(row){
  if(!row.url.trim()) return row.label.trim()?{cls:"",text:""}:{cls:"",text:""};
  const n=normalizeUrl(row.url);
  if(!n.ok) return {cls:"bad",text:n.msg};
  if(n.insecure) return {cls:"warn",text:"This link isn't encrypted (http). Use https:// if the site supports it.",https:true};
  return {cls:"good",text:"Opens "+n.host+" in a new tab."};
}
function paintLinks(focus){
  const c=linksCtx; if(!c) return;
  document.getElementById("linksRoot").innerHTML=`<div class="overlay" data-act="linksClose" data-overlay="1"><form class="modal" id="linksForm" role="dialog" aria-modal="true" aria-labelledby="lTitle" novalidate style="--c:${TYPES[c.type].color}">
    <div class="modal-head"><h2 id="lTitle">Links for ${esc(c.title)}</h2><button type="button" class="btn btn-ghost btn-sm" data-act="linksClose" aria-label="Close">✕</button></div>
    <p class="note" style="margin:0 0 14px">Add your own links: where you watch, stream, rent or buy it, a trailer, a gameplay video. NEXUS never adds or guesses streaming links. Links open in a new tab.</p>
    <div class="link-rows">${c.rows.map(row=>{ const m=rowMsg(row); return `<div class="lrow" data-row="${esc(row.id)}">
      <input class="input" data-lf="label" list="linkPresets" maxlength="40" placeholder="Name, e.g. Watch" value="${esc(row.label)}" aria-label="Link name" id="ll-${esc(row.id)}">
      <input class="input mono" data-lf="url" inputmode="url" autocomplete="off" spellcheck="false" maxlength="500" placeholder="https://…" value="${esc(row.url)}" aria-label="Web address" id="lu-${esc(row.id)}">
      <button type="button" class="icon-btn" data-act="linkDel" data-row="${esc(row.id)}" aria-label="Remove this link">✕</button>
      <div class="lrow-msg ${m.cls}">${esc(m.text)}${m.https?` <button type="button" class="linkbtn" data-act="linkHttps" data-row="${esc(row.id)}">Switch to https</button>`:""}</div></div>`; }).join("")||`<p class="note">No links. Add one below.</p>`}</div>
    <datalist id="linkPresets">${LINK_PRESETS.map(p=>`<option value="${p}">`).join("")}</datalist>
    <div class="chips" style="margin:14px 0 0"><span class="lbl" style="align-self:center;margin-right:4px">Quick add</span>${LINK_PRESETS.map(p=>`<button type="button" class="chip" data-act="linkPreset" data-v="${p}">+ ${p}</button>`).join("")}</div>
    <div class="modal-foot"><span class="note" id="linksErr" role="status" style="color:var(--movie)"></span><span class="spacer"></span><button type="button" class="btn" data-act="linksClose">Cancel</button><button type="submit" class="btn btn-primary">Save links</button></div>
  </form></div>`;
  if(focus){ setTimeout(()=>{ const last=c.rows[c.rows.length-1]; const el=last&&document.getElementById((last.url||!last.label?"lu-":"ll-")+last.id); if(el) el.focus(); },20); }
}
function syncLinkRows(){
  if(!linksCtx) return;
  document.querySelectorAll("#linksForm .lrow").forEach(el=>{ const row=linksCtx.rows.find(r=>r.id===el.dataset.row); if(!row) return;
    row.label=el.querySelector('[data-lf="label"]').value; row.url=el.querySelector('[data-lf="url"]').value; });
}
function saveLinks(){
  syncLinkRows(); const c=linksCtx; if(!c) return;
  const out=[], errs=[];
  c.rows.forEach(row=>{
    const label=row.label.trim(), url=row.url.trim();
    if(!label&&!url) return;
    if(!url){ errs.push(`“${label}” needs a web address.`); return; }
    const n=normalizeUrl(url); if(!n.ok){ errs.push(`${label||"A link"}: ${n.msg}`); return; }
    out.push({id:row.id,label:label||"Link",url:n.url});
  });
  if(errs.length){ $("#linksErr").textContent=errs[0]+(errs.length>1?` (${errs.length-1} more)`:""); paintLinksMsgs(); return; }
  if(out.length>20){ $("#linksErr").textContent="Keep it to 20 links per title."; return; }
  const item=byId(c.id);
  if(item){ item.links=out; item.updated=Date.now(); save(); }
  if(modalItem&&modalItem.id===c.id){ modalItem.links=out.map(l=>Object.assign({},l)); const ml=document.getElementById("mLinks"); if(ml) ml.innerHTML=linksHTML(modalItem)||`<span class="note">No links yet.</span>`; }
  closeLinks();
  toast(out.length?`Saved ${out.length} link${out.length>1?"s":""}${item||!modalItem?"":". Save the title to keep them"}`:"Links removed");
  if(view==="home") paintHome(); else if(view==="live") paintLive(); else if(TYPES[view]) renderLibrary(view);
  if(sheetKey) openDetail(sheetKey,true);
}
function paintLinksMsgs(){
  if(!linksCtx) return;
  document.querySelectorAll("#linksForm .lrow").forEach(el=>{ const row=linksCtx.rows.find(r=>r.id===el.dataset.row); if(!row) return;
    const m=rowMsg(row), box=el.querySelector(".lrow-msg"); box.className="lrow-msg "+m.cls;
    box.innerHTML=esc(m.text)+(m.https?` <button type="button" class="linkbtn" data-act="linkHttps" data-row="${esc(row.id)}">Switch to https</button>`:""); });
}

/* --- artwork matcher (used from the edit dialog; the user picks, nothing is guessed) --- */
async function matchArt(){
  const box=document.getElementById("matchBox"); if(!box||!modalItem) return;
  readForm(); const i=modalItem, q=i.title.trim();
  if(!q){ box.innerHTML=`<p class="note">Type the title first.</p>`; return; }
  box.innerHTML=`<div class="live-status" style="margin:8px 0 0"><span class="spinner" aria-hidden="true"></span><span>Searching ${{movie:"TMDB",anime:"AniList",game:"RAWG"}[i.type]}…</span></div>`;
  try{
    let items;
    if(i.type==="movie"){ const map=await tmdbMapper(); items=(await tmdb("/search/movie",{query:q,include_adult:"false"},{map})).data.items; }
    else if(i.type==="anime"){ items=(await anilist(Q_PAGE,{page:1,perPage:8,search:q,sort:["SEARCH_MATCH"]},{map:anilistPageMap})).data.items; }
    else { items=(await rawg("/games",{search:q,search_precise:"true",page_size:"8"},{map:rawgMap})).data.items; }
    reg(items);
    items=items.filter(r=>safeImg(r.poster)).sort((a,b)=>(i.year?(Math.abs((a.year||0)-i.year)-Math.abs((b.year||0)-i.year)):0)).slice(0,6);
    box.innerHTML = items.length ? `<p class="note" style="margin:10px 0 6px">Pick the right one. Only artwork, links and blank details are filled in.</p><div class="match-grid">${items.map(r=>`<button type="button" class="match" data-act="matchPick" data-k="${esc(r.src+":"+r.id)}">${artHTML(r,"match-art"+(r.type==="game"?" wide":""))}<span class="match-t">${esc(r.title)}</span><span class="match-s">${r.year||""} · ${srcName(r.src)}</span></button>`).join("")}</div>`
      : `<p class="note" style="margin-top:8px">No results with artwork for “${esc(q)}”. Check the spelling or try the original title.</p>`;
  }catch(e){ box.innerHTML=`<p class="note" style="margin-top:8px;color:var(--fg)">${esc(errMsg(e))}</p>`; }
}
function matchPick(k){
  const r=liveFind(k); if(!r||!modalItem) return;
  readForm();
  const i=modalItem; i.poster=safeImg(r.poster)||i.poster; i.backdrop=safeImg(r.backdrop)||i.backdrop;
  i.ext={src:r.src,id:r.id}; if(r.mal) i.ext.mal=r.mal; if(r.slug) i.ext.slug=r.slug;
  if(i.year==null||i.year==="") i.year=r.year; if(!i.genres.length) i.genres=r.genres.slice(0,12);
  if(i.type==="anime"&&(i.total==null||i.total==="")&&r.episodes) i.total=r.episodes;
  const keep=i._new; openModal(i,keep); toast("Artwork selected. Press Save to keep it.");
}

/* --- events for v3 features --- */
document.addEventListener("click", async e=>{
  if(e.target.closest("a[href]")) return;
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.overlay&&e.target!==el) return;
  switch(el.dataset.act){
    case "liveTab": live.tab=el.dataset.v; live.status="idle"; live.results=[]; closeSheet(); if(view!=="live") setView("live"); else render(); break;
    case "liveMode": live.mode[live.tab]=el.dataset.v; live.status="idle"; live.results=[]; render(); break;
    case "liveFilter": { if(el.disabled) break; const f=live.f[live.tab], id=el.dataset.v; f.on=f.on.includes(id)?f.on.filter(x=>x!==id):f.on.concat(id); el.setAttribute("aria-pressed",String(f.on.includes(id))); queueLive(); break; }
    case "liveClear": live.f[live.tab]=blankF(); live.status="idle"; render(); break;
    case "liveRefresh": liveLoad(true); break;
    case "liveMore": liveLoad(false,true); break;
    case "liveAdd": liveAdd(liveFind(el.dataset.k)); break;
    case "liveOv": { const p=document.getElementById("ov-"+el.dataset.k); if(p){ const o=p.classList.toggle("open"); el.textContent=o?"Show less":"Read more"; } break; }
    case "openLive": e.stopPropagation(); openDetail(el.dataset.k); break;
    case "sheetClose": closeSheet(); break;
    case "homeRefresh": loadHome(true); break;
    case "heroGo": home.heroIdx=+el.dataset.i; paintHero(); break;
    case "railScroll": { const tr=el.closest(".shelf").querySelector(".rail-track"); if(tr) tr.scrollBy({left:(+el.dataset.dir)*Math.max(240,tr.clientWidth*.85),behavior:reduced?"auto":"smooth"}); break; }
    case "railSee": { const d=RAILS.find(r=>r.id===el.dataset.rail); if(!d||!d.see) break; const [tab,mode,fl]=d.see; live.tab=tab; live.mode[tab]=mode; live.f[tab]=Object.assign(blankF(),{on:fl.slice()}); live.status="idle"; setView("live"); break; }
    case "links": {
      e.stopPropagation();
      if(el.dataset.from==="modal"&&modalItem){ readForm(); openLinks(modalItem); }
      else openLinks(byId(el.dataset.id));
      break; }
    case "linksClose": closeLinks(); break;
    case "linkDel": { syncLinkRows(); linksCtx.rows=linksCtx.rows.filter(r=>r.id!==el.dataset.row); paintLinks(); break; }
    case "linkPreset": { syncLinkRows(); const empty=linksCtx.rows.find(r=>!r.url.trim()&&!r.label.trim()); if(empty) empty.label=el.dataset.v; else linksCtx.rows.push({id:uid(),label:el.dataset.v,url:""}); paintLinks(true); break; }
    case "linkHttps": { syncLinkRows(); const row=linksCtx.rows.find(r=>r.id===el.dataset.row); if(row) row.url=row.url.trim().replace(/^http:\/\//i,"https://"); paintLinks(); break; }
    case "matchArt": matchArt(); break;
    case "matchPick": matchPick(el.dataset.k); break;
    case "setShow": { const i=document.getElementById("key-"+el.dataset.kind); i.type=i.type==="password"?"text":"password"; el.textContent=i.type==="password"?"Show":"Hide"; break; }
    case "setSave": {

const PLAY_SVG = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>`;

function fillPattern(tpl, vals){

function startFX(){
  const layer=document.getElementById("bgLayer");
  if(layer) layer.style.backgroundImage=`url("${BG_DATA}")`;
  const c=document.getElementById("fx"); if(!c||reduced) return;
  const ctx=c.getContext("2d"); if(!ctx) return;
  let W=0, H=0, petals=[], motes=[], px=0, py=0, tx=0, ty=0, last=0, lastT="";
  const petal=(()=>{ const s=document.createElement("canvas"); s.width=s.height=64; const g=s.getContext("2d"); g.translate(32,32);
    const gr=g.createLinearGradient(-18,-28,18,28); gr.addColorStop(0,"#ffe1ef"); gr.addColorStop(.55,"#ffa3cf"); gr.addColorStop(1,"#e9649f");
    g.fillStyle=gr; g.beginPath(); g.moveTo(0,-26); g.bezierCurveTo(22,-22,22,12,0,28); g.bezierCurveTo(-22,12,-22,-22,0,-26); g.fill();
    g.globalCompositeOperation="destination-out"; g.beginPath(); g.moveTo(-6,-30); g.lineTo(0,-19); g.lineTo(6,-30); g.closePath(); g.fill(); return s; })();
  const mote=(()=>{ const s=document.createElement("canvas"); s.width=s.height=32; const g=s.getContext("2d"); const gr=g.createRadialGradient(16,16,0,16,16,16);
    gr.addColorStop(0,"rgba(255,235,248,1)"); gr.addColorStop(.25,"rgba(255,140,205,.75)"); gr.addColorStop(1,"rgba(169,139,255,0)"); g.fillStyle=gr; g.fillRect(0,0,32,32); return s; })();
  const mk=init=>({x:Math.random()*(W+160), y:init?Math.random()*H:-30-Math.random()*60, s:7+Math.random()*9, vy:.35+Math.random()*.7, vx:-.15-Math.random()*.45, a:Math.random()*6.28, va:(Math.random()-.5)*.03, ph:Math.random()*6.28, fl:Math.random()*6.28, o:.5+Math.random()*.45, z:.6+Math.random()*.8});
  function size(){
    const dpr=Math.min(1.5,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(34,Math.max(10,W*H/46000)));
    petals=Array.from({length:n},()=>mk(true));
    motes=Array.from({length:Math.round(n*.9)},()=>({x:Math.random()*W, y:Math.random()*H, r:1+Math.random()*2.2, vy:-.08-Math.random()*.22, ph:Math.random()*6.28, sp:.01+Math.random()*.03}));
  }
  size();
  addEventListener("resize",()=>{ clearTimeout(size._t); size._t=setTimeout(size,200); });
  addEventListener("pointermove",e=>{ if(e.pointerType==="mouse"){ tx=e.clientX/W-.5; ty=e.clientY/H-.5; } },{passive:true});
  function frame(t){
    requestAnimationFrame(frame);
    if(document.hidden) { last=t; return; }
    const dt=Math.min(3,last?(t-last)/16.7:1); last=t;
    px+=(tx-px)*.05; py+=(ty-py)*.05;
    const sy=Math.min(14,(window.scrollY||0)*.03);
    const tr=`translate3d(${(-px*10).toFixed(1)}px,${(-py*6-sy).toFixed(1)}px,0) scale(1.02)`;
    if(layer && tr!==lastT){ layer.style.transform=tr; lastT=tr; }
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    for(const m of motes){ m.y+=m.vy*dt; m.ph+=m.sp*dt; if(m.y<-12){ m.y=H+12; m.x=Math.random()*W; }
      ctx.globalAlpha=(.3+.7*Math.abs(Math.sin(m.ph)))*.6; const d=m.r*7; ctx.drawImage(mote,m.x-d/2-px*6,m.y-d/2,d,d); }

      p.ph+=.02*dt; p.y+=p.vy*p.z*dt; p.x+=(p.vx+Math.sin(p.ph)*.55)*p.z*dt; p.a+=p.va*dt; p.fl+=.03*dt;
      if(p.y>H+40||p.x<-50){ Object.assign(p,mk(false)); }

    }
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
}

      const ex=store.items.find(i=>i.type===type&&norm(i.title)===norm(en.title));
      if(ex){ if(!ex.fav){ ex.fav=true; ex.updated=Date.now(); save(); } toast(`${ex.title} is in your favourites`); }
      else { const g=genresFor(en.title,type); upsert(Object.assign(blank(type),{title:en.title,year:en.year,genres:en.genres.length?en.genres.slice():(g?g.genres:[]),fav:true})); toast(`Added ${en.title} to favourites`); }
      paintMatch(); break; }
    case "tierSel": {
      if(performance.now()-drag.lastEnd<400) break;
      const id=el.dataset.tid; tierUI.sel=tierUI.sel===id?null:id;
      document.querySelectorAll(".tier-item.sel").forEach(x=>x.classList.remove("sel")); if(tierUI.sel) el.classList.add("sel"); break; }
    case "tierTap": if(tierUI.sel && performance.now()-drag.lastEnd>=400){ const id=tierUI.sel; tierUI.sel=null; tierMove(id,el.dataset.tier); } break;
    case "tierType": tierUI.type=el.dataset.v; document.querySelectorAll('[data-act="tierType"]').forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===tierUI.type))); paintTiers(); break;
    case "tierNew": { const T=store.settings.tiers; if(T.lists.length>=20){ toast("You can keep up to 20 tier lists"); break; } const l={id:uid(),name:"Tier list "+(T.lists.length+1),rows:{S:[],A:[],B:[],C:[],D:[]}}; T.lists.push(l); T.active=l.id; save(); render(); toast("New tier list ready"); break; }
    case "tierDel": {
      if(!el.classList.contains("armed")){ el.classList.add("armed"); const was=el.textContent; el.textContent="Tap again to confirm"; setTimeout(()=>{ if(el.isConnected){ el.classList.remove("armed"); el.textContent=was; } },3500); break; }
      const T=store.settings.tiers, l=tierState();
      if(T.lists.length>1){ T.lists=T.lists.filter(x=>x.id!==l.id); T.active=T.lists[0].id; toast("Tier list deleted"); } else { TIERS.forEach(t=>{ l.rows[t]=[]; }); toast("Tier list cleared"); }
      save(); render(); break; }
    case "tierExport": exportTiers(); break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.slotText){ matchUI[t.dataset.slotText].text=t.value; return; }
  if(t.id==="tierQ"){ tierUI.q=t.value; paintTiers(); return; }
  if(t.dataset.watch){ const m=document.getElementById("wm-"+t.dataset.watch); if(m) m.innerHTML=watchMsg(t.value.trim()); }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.slotFile && t.files && t.files[0]){
    const k=t.dataset.slotFile, f=t.files[0];
    if(f.size>3e6){ toast("That file is too large (3 MB max)"); return; }
    const r=new FileReader(); r.onload=()=>{ matchUI[k].text=String(r.result||""); const ta=document.querySelector(`[data-slot-text="${k}"]`); if(ta) ta.value=matchUI[k].text; toast(`${f.name} loaded. Press Compare tastes.`); }; r.onerror=()=>toast("Couldn't read that file"); r.readAsText(f); return;
  }
  if(t.id==="tierPick"){ store.settings.tiers.active=t.value; tierUI.sel=null; save(); render(); return; }
  if(t.id==="tierName"){ const l=tierState(); l.name=t.value.trim().slice(0,50)||"My tier list"; save(); const o=document.querySelector(`#tierPick option[value="${CSS.escape(l.id)}"]`); if(o) o.textContent=l.name; return; }
  if(t.id==="pName"){ store.settings.profileName=t.value.trim().slice(0,40); save(); const av=document.querySelector(".id-avatar"); if(av) av.textContent=initials(profileName()); toast("Name saved"); return; }
  if(t.id==="pSite"){ const v=t.value.trim(); if(!v){ store.settings.siteUrl=""; save(); toast("Share-link address cleared"); return; }
    const n=normalizeUrl(v); if(!n.ok){ toast(n.msg); return; } if(n.insecure){ toast("Use the https:// address of your site"); return; }
    store.settings.siteUrl=n.url.split("#")[0]; t.value=store.settings.siteUrl; save(); toast("Share-link address saved"); return; }
  if(view==="live" && t.id==="livePlat"){ live.f[live.tab].plat=t.value; queueLive(); return; }
  if(view==="live" && t.id==="liveRegion"){ store.settings.region=t.value; save(); live.provs=null; const had=live.f.movie.plat; live.f.movie.plat=""; render(); if(had) queueLive(); return; }
});

/* ===================== boot ===================== */
load();
startFX();
const fromHash=readHash();
setView(fromHash?"match":(TYPES[view]||VIEWS.includes(view)?view:"home"));
if(fromHash) runMatch();
})();
</script>
