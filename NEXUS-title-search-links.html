<title>NEXUS — Entertainment Hub</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://image.tmdb.org https://s4.anilist.co https://media.rawg.io https://cdn.myanimelist.net https://www.themoviedb.org; connect-src 'self' https://nexus-api.prakruthiii20.workers.dev https://graphql.anilist.co; object-src 'none'; base-uri 'none'; form-action 'self'">

<style>
/* Layout: app shell — slim command rail on the left (bottom dock on phones), working canvas on the right.
   Each medium owns one hue: anime = sakura, horror/movies = blood, games = arc-cyan. Gold is reserved for ratings. */
:root{
  color-scheme: dark;
  --bg:#09060e;
  --surface:rgba(22,14,30,.82);
  --surface-2:rgba(38,24,50,.86);
  --surface-3:rgba(58,38,76,.92);
  --line:rgba(255,170,220,.14);
  --fg:#f2edf8;
  --muted:#b6abc8;
  --faint:#817798;
  --anime:#ff7ab8;
  --movie:#ec4a52;
  --game:#3fc8e4;
  --gold:#f3c454;
  --ok:#5fd48d;
  --accent:#e58bd6;
  --sakura:#ff9fcf;
  --violet:#a98bff;
  --glow:rgba(255,120,200,.38);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
  --rail:232px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--bg))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.brand-mark{width:30px;height:30px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.08em}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:-2px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;text-align:left;transition:background .15s,color .15s}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--surface-3);color:var(--fg)}
.nav-btn .dot{width:7px;height:7px;border-radius:50%;margin-left:auto;background:var(--c,transparent)}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.rail-foot{margin-top:auto;font-size:12px;color:var(--faint);padding:10px}
.main{min-width:0;padding-block:28px 60px;padding-inline:clamp(16px,3.4vw,44px)}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.view-title{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.4vw,34px);letter-spacing:.01em;margin-top:4px}
.view-title em{font-style:normal;color:var(--c,var(--accent))}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-weight:700;font-size:14px;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--surface-3);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn-primary:hover{background:#fff;border-color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--fg);border-color:transparent}
.btn-danger{color:var(--movie);border-color:color-mix(in srgb,var(--movie) 40%,var(--line))}
.btn-danger.armed{background:var(--movie);color:#fff;border-color:var(--movie)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.input,.select,textarea.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
.input:focus,.select:focus{border-color:var(--accent);outline:none}
textarea.input{resize:vertical;min-height:84px;font-family:var(--f-mono);font-size:12.5px;line-height:1.55}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1 1 220px;position:relative}
.toolbar .search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--faint)}
.toolbar .search .input{padding-left:36px}
.toolbar .select{width:auto;flex:0 1 180px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;transition:all .15s}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);border-color:var(--c,var(--accent));color:var(--fg)}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg)}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:flex;gap:14px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);transition:border-color .15s,transform .15s;cursor:pointer;min-width:0}
.card:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line));transform:translateY(-1px)}
.poster{flex:none;width:64px;height:90px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;color:rgba(255,255,255,.92);letter-spacing:.02em;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.poster::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.card-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.card-title{font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc,var(--faint))}
.status[data-s="active"]{--sc:var(--c);color:var(--fg)}
.status[data-s="done"]{--sc:var(--ok)}
.status[data-s="planned"]{--sc:var(--accent)}
.status[data-s="paused"]{--sc:var(--gold)}
.status[data-s="dropped"]{--sc:var(--faint)}
.rating{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--gold)}
.rating small{color:var(--faint);font-weight:500}
.bar{height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.card-foot .spacer{flex:1}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.tag.hit{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--fg)}
.fav{border:0;background:transparent;color:var(--faint);padding:2px;line-height:0}
.fav[aria-pressed="true"]{color:var(--gold)}
.fav svg{width:17px;height:17px}
.sample-badge{position:absolute;top:8px;right:10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.empty{padding:40px 24px;border:1px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);font-size:17px;margin-bottom:6px}
.empty .btn{margin-top:14px}

/* ---------- dashboard ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-title{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.span-12{grid-column:span 12}.span-7{grid-column:span 7}.span-5{grid-column:span 5}
.medium-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.medium{position:relative;overflow:hidden;padding:18px 18px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:border-color .15s}
.medium:hover{border-color:var(--c)}
.medium::before{content:"";position:absolute;inset:-40% -20% auto auto;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%)}
.medium h3{font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--c);position:relative}
.medium .big{font-family:var(--f-mono);font-size:32px;font-weight:700;margin-top:10px;position:relative}
.medium .big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.medium .row{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px;position:relative;flex-wrap:wrap}
.medium .row b{color:var(--fg);font-family:var(--f-mono)}
.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.list-row:first-child{border-top:0;padding-top:0}
.list-row .poster{width:38px;height:52px;font-size:12px;border-radius:6px}
.list-row .grow{flex:1;min-width:0}
.list-row .t{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;color:var(--muted);margin-bottom:18px}
.banner b{color:var(--fg)}
.banner .grow{flex:1 1 260px}

/* ---------- spin ---------- */
.spin-window{position:relative;height:118px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:14px 16px;overflow:hidden;margin-bottom:12px}
.spin-window .poster{width:62px;height:88px}
.spin-window.rolling .spin-text{filter:blur(.4px);opacity:.8}
.spin-text{min-width:0}
.spin-text .t{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.spin-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spin-stage{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 16px}
.wheel-wrap{position:relative;width:min(340px,100%);aspect-ratio:1;display:grid;place-items:center;filter:drop-shadow(0 14px 24px rgba(0,0,0,.28))}
#wheelCanvas{display:block;width:100%;height:100%;border-radius:50%}
.wheel-pointer{position:absolute;z-index:2;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:27px solid var(--gold);filter:drop-shadow(0 2px 3px rgba(0,0,0,.65))}
.wheel-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--surface);border:4px solid var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--fg);box-shadow:0 3px 12px rgba(0,0,0,.4);pointer-events:none}
.wheel-caption{font-size:12px;color:var(--muted);text-align:center}

/* ---------- discover ---------- */
.dna{display:flex;flex-direction:column;gap:9px}
.dna-row{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.dna-row .bar{height:8px}
.dna-row .bar i{background:linear-gradient(90deg,var(--accent),var(--anime))}
.dna-row span:last-child{text-align:right;color:var(--muted)}
.rec{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-width:0}
.rec-top{display:flex;gap:14px;align-items:flex-start}
.match{margin-left:auto;text-align:right;flex:none}
.match b{display:block;font-family:var(--f-mono);font-size:20px;color:var(--fg)}
.match span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.why{font-size:13px;color:var(--muted);border-left:2px solid var(--c);padding-left:10px}
.why b{color:var(--fg);font-weight:600}
.rec-actions{display:flex;gap:8px;flex-wrap:wrap}
.type-pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}

/* ---------- backup ---------- */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.note{font-size:13px;color:var(--muted)}
.note code{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);padding:1px 6px;border-radius:5px;color:var(--fg)}
.radio-row{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.radio-row label{display:flex;gap:7px;align-items:center;cursor:pointer}
.file-drop{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border:1px dashed var(--faint);border-radius:10px;color:var(--muted);cursor:pointer;text-align:center;font-size:14px}
.file-drop:hover,.file-drop.over{border-color:var(--accent);color:var(--fg)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,4,10,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 4vh) 16px 24px;overflow-y:auto}
.modal{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.modal-head h2{font-family:var(--f-display);font-size:18px;font-weight:700}
.form-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.c6{grid-column:span 6}.c3{grid-column:span 3}.c2{grid-column:span 2}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pip{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-family:var(--f-mono);font-weight:700;font-size:13px}
.pip.on{background:color-mix(in srgb,var(--gold) 22%,transparent);border-color:var(--gold);color:var(--gold)}
.modal-foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.modal-foot .spacer{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;padding:10px 18px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:700;font-size:14px;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- responsive ---------- */
@media (max-width:1100px){.span-7,.span-5{grid-column:span 12}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:40;flex-direction:row;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px)}
  .brand,.nav-sep,.rail-foot{display:none}
  .nav-btn{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:10.5px;text-align:center;justify-content:center}
  .nav-btn .dot{display:none}
  .main{padding-block:20px 110px}
  .mobile-brand{display:flex!important}
  .medium-strip{grid-template-columns:minmax(0,1fr)}
  .two{grid-template-columns:minmax(0,1fr)}
  .toolbar .select{flex:1 1 140px}
}
@media (max-width:520px){
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c6,.c3{grid-column:span 2}.c2{grid-column:span 1}
  .grid{grid-template-columns:minmax(0,1fr)}
  .dna-row{grid-template-columns:90px minmax(0,1fr) 34px}
}
.mobile-brand{display:none;align-items:center;gap:10px;margin-bottom:18px}

/* ---------- live discover + settings (v2) ---------- */
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.offline-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px}
.lcard{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-width:0;align-items:start}
.lposter{position:relative;width:104px;max-width:100%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surface-3);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--muted)}
.lposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.live-badge{position:absolute;left:5px;bottom:5px;font-size:9px;font-weight:800;letter-spacing:.1em;padding:3px 5px;border-radius:5px;background:rgba(12,10,18,.88);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);white-space:nowrap}
.lbody{min-width:0;display:flex;flex-direction:column;gap:7px}
.ltitle{font-weight:700;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.overview{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.overview.open{display:block;-webkit-line-clamp:unset}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:12.5px;padding:0;align-self:flex-start}
.live-status{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}
.live-status b{color:var(--fg)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pulse 2s infinite}
.pulse.cached{background:var(--gold);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.notes{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.notes p{margin:0;font-size:12.5px;color:var(--muted);padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:6px}
@keyframes shimmer{to{background-position:-200% 0}}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.panel.err{border-color:color-mix(in srgb,var(--movie) 55%,var(--line))}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.frow .field{flex:1 1 130px}
.chip:disabled{opacity:.4;cursor:not-allowed}
.attrib{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.attrib img{height:14px;width:auto;display:block}
.attrib a{color:var(--muted)}
.keyrow{display:flex;gap:8px;flex-wrap:wrap}
.keyrow .input{flex:1 1 260px;font-family:var(--f-mono);font-size:13px}
.mb-actions{margin-left:auto;display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.icon-btn svg{width:18px;height:18px}
.steps{margin:0;padding-left:20px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.steps b{color:var(--fg)}
@media (max-width:860px){.nav-secondary{display:none!important}}
@media (max-width:420px){.lcard{grid-template-columns:84px minmax(0,1fr)}.lposter{width:84px}}

/* ---------- v3: hub visuals ---------- */
.src-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:6px;white-space:nowrap;line-height:1.3}
.src-chip.live{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.src-chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.src-chip.offline{color:var(--muted);background:var(--surface-2);border:1px solid var(--line)}
.ph{font-family:var(--f-display);font-weight:800;font-size:clamp(14px,2.4vw,22px);color:rgba(255,255,255,.85);letter-spacing:.03em;position:relative}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;min-height:clamp(340px,42vw,470px);display:flex;align-items:flex-end;background:var(--surface);border:1px solid var(--line);margin-bottom:28px;isolation:isolate}
.hero-art{position:absolute;inset:0;z-index:-2;background:linear-gradient(135deg,var(--surface-3),var(--bg))}
.hero-art img{width:100%;height:100%;object-fit:cover;object-position:center 25%;animation:heroIn .9s ease both}
.hero-art.hero-blank{background:radial-gradient(120% 90% at 85% 10%,color-mix(in srgb,var(--anime) 30%,transparent),transparent 60%),radial-gradient(90% 80% at 10% 100%,color-mix(in srgb,var(--game) 22%,transparent),transparent 60%),linear-gradient(160deg,var(--surface-3),var(--bg))}
@keyframes heroIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.hero-fade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(12,10,18,.96) 0%,rgba(12,10,18,.82) 34%,rgba(12,10,18,.25) 70%,rgba(12,10,18,.1) 100%),linear-gradient(0deg,rgba(12,10,18,.9) 0%,transparent 55%)}
.hero-content{position:relative;padding:clamp(22px,3.4vw,40px);max-width:620px;display:flex;flex-direction:column;gap:12px;animation:heroIn .7s ease both}
.hero-kick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero-title{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4.2vw,48px);line-height:1.05;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:baseline}
.hero-meta span+span::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--faint);margin-right:14px;vertical-align:middle}
.hero-meta .rating::before{display:none!important}
.hero-ov{margin:0;font-size:14.5px;color:color-mix(in srgb,var(--fg) 82%,transparent);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:58ch}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.btn-glass{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);backdrop-filter:blur(8px)}
.btn-glass:hover{background:rgba(255,255,255,.16)}
.hero-dots{position:absolute;right:clamp(16px,3vw,32px);bottom:clamp(16px,3vw,30px);display:flex;gap:7px}
.hero-dots button{width:9px;height:9px;border-radius:999px;border:0;padding:0;background:rgba(255,255,255,.3);transition:width .25s,background .25s}
.hero-dots button[aria-current="true"]{width:26px;background:var(--fg)}
.hero.is-loading .hero-content{width:100%}

/* rails */
.shelf{margin-block:6px 26px;min-width:0}
.rail-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin-bottom:12px;flex-wrap:wrap}
.rail-titles{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.rail-title{font-family:var(--f-display);font-weight:700;font-size:clamp(16px,1.8vw,19px);letter-spacing:.01em}
.rail-meta{font-size:12px;color:var(--faint)}
.rail-sub{flex-basis:100%;font-size:12.5px;color:var(--muted);margin-top:-4px}
.rail-ctrl{display:flex;gap:6px;align-items:center}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.icon-btn.sm svg{width:15px;height:15px}
.icon-btn:hover{color:var(--fg);border-color:var(--faint)}
.rail-track{display:flex;gap:14px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:4px 2px 12px;scrollbar-width:thin;scrollbar-color:var(--surface-3) transparent;-webkit-overflow-scrolling:touch}
.rail-track::-webkit-scrollbar{height:6px}.rail-track::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px}
.tile{position:relative;flex:0 0 clamp(124px,13vw,160px);scroll-snap-align:start;display:flex;flex-direction:column;text-align:left;background:none;border:0;padding:0;color:inherit;min-width:0}
.tile.wide{flex-basis:clamp(210px,22vw,270px)}
.tile-art{position:relative;aspect-ratio:2/3;width:100%;border-radius:12px;overflow:hidden;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.06);transition:transform .25s ease,box-shadow .25s ease}
.tile.wide .tile-art{aspect-ratio:16/9}
.tile-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.tile-art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 45%);opacity:.7;transition:opacity .25s}
.tile:hover .tile-art,.tile:focus-visible .tile-art{transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.5),0 0 0 2px var(--c)}
.tile:hover .tile-art img{transform:scale(1.06)}
.tile:hover .tile-art::after{opacity:1}
.tile:focus-visible{outline:none}
.tile-score{position:absolute;top:8px;left:8px;z-index:2;font-family:var(--f-mono);font-weight:700;font-size:11.5px;padding:2px 7px;border-radius:6px;background:rgba(12,10,18,.82);color:var(--gold)}
.tile-flag{position:absolute;top:8px;right:8px;z-index:2;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--fg);color:var(--bg)}
.tile-prog{position:relative;z-index:2;display:block;height:4px;margin:-12px 8px 8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.tile-prog i{display:block;height:100%;background:var(--c)}
.tile-title{margin-top:9px;font-weight:700;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .skel.tile-art{box-shadow:none}
.rail-error{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--movie) 45%,var(--line));background:var(--surface);font-size:13.5px;color:var(--muted)}
.rail-error span{flex:1 1 260px}
.connect.compact{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:16px 18px}
.connect.compact .panel-title{font-size:14px;flex:1 1 220px}
.connect.compact .note{flex:1 1 260px}
.art-empty{background:radial-gradient(60% 120% at 50% 0%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%)}
.empty.slim{padding:22px 18px}

/* live cards v3 */
.lposter-btn{position:relative;padding:0;border:0;background:none;border-radius:8px;align-self:start}
.lposter-btn:hover .lposter img{transform:scale(1.05)}
.lposter img{transition:transform .4s ease}
.lposter .ph{font-size:18px}
.lcard{transition:border-color .2s,transform .2s}
.lcard:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.lcard.wide{grid-template-columns:150px minmax(0,1fr)}
.lcard.wide .lposter{width:150px;aspect-ratio:16/10}
@media (max-width:420px){.lcard.wide{grid-template-columns:110px minmax(0,1fr)}.lcard.wide .lposter{width:110px}}

/* detail sheet */
.sheet{width:min(880px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:sheetIn .3s ease both}
@keyframes sheetIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sheet-hero{position:relative;height:clamp(170px,30vw,280px);background:linear-gradient(135deg,var(--surface-3),var(--bg))}
.sheet-hero img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
.sheet-fade{position:absolute;inset:0;background:linear-gradient(0deg,var(--surface) 0%,rgba(20,17,28,.4) 55%,rgba(20,17,28,.15) 100%)}
.sheet-x{position:absolute;top:12px;right:12px;background:rgba(12,10,18,.7);color:var(--fg)}
.sheet-body{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;padding:0 24px 24px;margin-top:-70px;position:relative}
.sheet-poster{position:relative;width:150px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;display:grid;place-items:center;box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.sheet-poster.wide{aspect-ratio:16/10;align-self:start;margin-top:40px}
.sheet-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sheet-main{display:flex;flex-direction:column;gap:10px;min-width:0;padding-top:76px}
.sheet-title{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,32px);line-height:1.1}
.sheet-ov{margin:0;font-size:14px;color:color-mix(in srgb,var(--fg) 84%,transparent);line-height:1.6;max-width:65ch}
@media (max-width:620px){.sheet-body{grid-template-columns:minmax(0,1fr);margin-top:-56px;padding:0 16px 18px}.sheet-poster{width:110px}.sheet-poster.wide{width:160px;margin-top:0}.sheet-main{padding-top:0}}

/* personal links */
.links{display:flex;flex-wrap:wrap;gap:6px}
.lnk{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 10px;border-radius:8px;background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface-2));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 38%,var(--line));color:var(--fg);font-weight:700;font-size:12.5px;text-decoration:none;transition:background .15s,transform .1s;cursor:pointer;font-family:var(--f-body)}
.lnk:hover{background:color-mix(in srgb,var(--c,var(--accent)) 26%,var(--surface-2))}
.lnk:active{transform:translateY(1px)}
.lnk svg{width:13px;height:13px;flex:none}
.lnk small{font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14ch}
.lnk em{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.lnk.more{background:transparent;border-style:dashed;color:var(--muted)}
.link-rows{display:flex;flex-direction:column;gap:12px}
.lrow{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr) 38px;gap:8px;align-items:center}
.lrow-msg{grid-column:1/-1;font-size:12px;color:var(--faint);min-height:0}
.lrow-msg:empty{display:none}
.lrow-msg.bad{color:var(--movie)}.lrow-msg.warn{color:var(--gold)}.lrow-msg.good{color:var(--ok)}
@media (max-width:520px){.lrow{grid-template-columns:minmax(0,1fr) 38px}.lrow [data-lf="url"]{grid-column:1/2}.lrow [data-lf="label"]{grid-column:1/2}.lrow .icon-btn{grid-row:1;grid-column:2}}
.art-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.match{display:flex;flex-direction:column;gap:4px;padding:0;border:0;background:none;color:inherit;text-align:left}
.match-art{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line);transition:box-shadow .15s}
.match-art.wide{aspect-ratio:16/10}
.match-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.match:hover .match-art{box-shadow:0 0 0 2px var(--accent)}
.match-t{font-size:12px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.match-s{font-size:11px;color:var(--muted)}
.card .links{margin-top:2px}
@media (max-width:860px){.hero{border-radius:18px;min-height:420px}.hero-fade{background:linear-gradient(0deg,rgba(12,10,18,.97) 0%,rgba(12,10,18,.75) 45%,rgba(12,10,18,.15) 100%)}.hero-dots{top:16px;bottom:auto}.rail-ctrl .icon-btn{display:none}}
/* ---------- v4: cinematic sakura layer ---------- */
.bg-layer{position:fixed;inset:-2%;z-index:0;background-color:var(--bg);background-position:right center;background-size:cover;background-repeat:no-repeat;will-change:transform;transform:scale(1.02);pointer-events:none;image-rendering:auto}
.bg-shade{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 95% at 85% 40%,transparent 0%,rgba(9,6,14,.18) 60%,rgba(9,6,14,.6) 100%),linear-gradient(90deg,rgba(9,6,14,.62) 0%,rgba(9,6,14,.34) 45%,rgba(9,6,14,.06) 100%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.shell{position:relative;z-index:1}
@media (min-width:861px){.rail{background:linear-gradient(180deg,rgba(26,14,34,.82),rgba(10,6,16,.7));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right-color:rgba(255,160,215,.12)}}
.main.view-in{animation:viewIn .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.brand-name{background:linear-gradient(90deg,#fff 0%,var(--sakura) 55%,var(--violet) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.view-title em{text-shadow:0 0 28px color-mix(in srgb,var(--c,var(--sakura)) 55%,transparent)}
.eyebrow{color:color-mix(in srgb,var(--sakura) 55%,var(--muted))}
.btn-primary{background:linear-gradient(135deg,var(--sakura),var(--violet));color:#1a0b1e;border-color:transparent;box-shadow:0 8px 24px -10px var(--glow)}
.btn-primary:hover{background:linear-gradient(135deg,#ffc3e1,#c4b0ff);border-color:transparent}
.nav-btn[aria-current="page"]{background:linear-gradient(90deg,rgba(255,140,200,.22),rgba(169,139,255,.1));box-shadow:inset 2px 0 0 var(--sakura)}
@media (max-width:860px){.nav-btn[aria-current="page"]{box-shadow:inset 0 2px 0 var(--sakura)}}
.panel,.card,.lcard,.rec,.medium{box-shadow:0 14px 34px -22px rgba(0,0,0,.9)}
.panel,.medium{background:linear-gradient(180deg,rgba(30,18,40,.8),rgba(18,11,26,.82))}
.card,.lcard,.rec{transition:border-color .25s,transform .25s,box-shadow .3s}
.card:hover,.lcard:hover,.rec:hover{transform:translateY(-3px);box-shadow:0 20px 44px -20px var(--glow),0 0 0 1px color-mix(in srgb,var(--c,var(--sakura)) 45%,transparent)}
.card .poster,.lposter img{transition:transform .4s ease,box-shadow .4s}
.card:hover .poster{transform:scale(1.06) rotate(-1.2deg);box-shadow:0 12px 26px -8px var(--glow)}
.tile:hover .tile-art,.tile:focus-visible .tile-art{box-shadow:0 20px 42px -12px var(--glow),0 0 0 2px var(--c)}
.tile-art::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);transform:translateX(-130%);transition:transform .8s ease;pointer-events:none}
.tile:hover .tile-art::before,.tile:focus-visible .tile-art::before{transform:translateX(130%)}
.hero{box-shadow:0 30px 70px -35px rgba(255,110,190,.45);border-color:rgba(255,160,215,.16)}
.overlay{background:rgba(8,4,12,.66)}
.modal,.sheet{background:linear-gradient(180deg,rgba(32,20,44,.97),rgba(18,11,26,.98));border-color:rgba(255,160,215,.16)}
.chip[aria-pressed="true"]{box-shadow:0 0 16px -6px var(--c,var(--sakura))}
.fav svg{transition:transform .2s}.fav:hover svg{transform:scale(1.15)}
/* watch buttons */
.watch{display:flex;flex-wrap:wrap;gap:6px}
.wbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,160,215,.35);background:linear-gradient(135deg,rgba(255,140,200,.14),rgba(169,139,255,.12));color:var(--fg);font-weight:700;font-size:12.5px;text-decoration:none;font-family:var(--f-body);transition:box-shadow .2s,background .2s,transform .1s;white-space:nowrap}
.wbtn:hover{box-shadow:0 6px 18px -6px var(--glow);background:linear-gradient(135deg,rgba(255,140,200,.3),rgba(169,139,255,.26))}
.wbtn:active{transform:translateY(1px)}
.wbtn.on{background:linear-gradient(135deg,var(--sakura),var(--violet));color:#1a0b1e;border-color:transparent}
.wbtn svg{width:11px;height:11px;flex:none}
.wbtn.setup{background:transparent;border-style:dashed;color:var(--muted)}
.wbtn.warn{opacity:.72}
.wsel button{font-size:12.5px}
.spin-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.spin-acts:empty{display:none}
.favtoggle{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-weight:600;font-size:14px}
.favtoggle input{accent-color:var(--sakura);width:17px;height:17px;margin:0}
/* share modal */
.share-modal{width:min(560px,100%)}
.share-img{display:block;width:100%;max-height:62vh;object-fit:contain;border-radius:12px;background:#07040b;box-shadow:0 20px 50px -20px var(--glow)}
/* tier lists */
.tier-board{display:flex;flex-direction:column;gap:8px}
.tier-row{display:grid;grid-template-columns:76px minmax(0,1fr);border-radius:14px;overflow:hidden;border:1px solid var(--line);background:rgba(20,12,28,.8)}
.tier-label{border:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:30px;color:#170a14;background:var(--tc);padding:0;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.tier-drop{display:flex;flex-wrap:wrap;gap:8px;padding:8px;min-height:106px;align-content:flex-start;transition:background .15s,box-shadow .15s}
.tier-drop.over{background:color-mix(in srgb,var(--tc,var(--sakura)) 18%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tc,var(--sakura)) 60%,transparent)}
.tier-pool{border-radius:12px;background:rgba(9,6,14,.45);min-height:120px}

function tasteProfile(){
  const w={}; let signals=0;
  for(const i of store.items){
    let d = 0;
    if(i.rating!=null){ d=(i.rating-6)/4; signals++; }
    else if(i.status==="done") d=.2;
    else if(i.status==="active") d=.3;
    else if(i.status==="dropped") d=-.5;
    if(i.fav) d+=.4;
    if(!d) continue;
    for(const g of i.genres) w[g]=(w[g]||0)+d;
  }
  return {w, signals};
}
function recommend(opts){
  const {w,signals} = tasteProfile();
  const owned = new Set(store.items.map(i=>i.type+":"+norm(i.title)));
  const dismissed = new Set(store.settings.dismissed||[]);
  const moodG = opts.mood ? MOODS[opts.mood] : null;
  const typeCount = {anime:0,movie:0,game:0}; store.items.forEach(i=>typeCount[i.type]++);
  const total = store.items.length||1;
  const pool = [];
  CATALOG.forEach(c=>{ const k=c.type+":"+norm(c.title); if(!owned.has(k)&&!dismissed.has(k)) pool.push({...c,src:"catalog",key:k}); });
  const rated = store.items.filter(i=>i.rating!=null&&i.rating>=7);
  const out = pool.filter(c=>opts.type==="all"||c.type===opts.type).map(c=>{
    let s=0; c.genres.forEach(g=>s+=(w[g]||0)); s/=Math.sqrt(Math.max(1,c.genres.length));
    let moodHits=0; if(moodG){ moodHits=c.genres.filter(g=>moodG.includes(g)).length; s+=moodHits*.6; if(!moodHits) s-=1; }
    s += (typeCount[c.type]/total)*.3;
    if(c.src==="backlog") s+=.25;
    s += ((hash(c.title+opts.seed)%1000)/1000-.5)*.35;
    let anchor=null, best=0;
    for(const r of rated){ if(r.title===c.title) continue; const sh=r.genres.filter(g=>c.genres.includes(g)); const v=sh.length*r.rating; if(sh.length&&v>best){best=v;anchor={item:r,shared:sh}} }
    const pct = Math.max(38,Math.min(99,Math.round(62+36*Math.tanh(s/1.6))));
    return {...c,score:s,pct,anchor,moodHits};
  }).sort((a,b)=>b.score-a.score);
  return {list:out.slice(0,opts.limit||9), signals, w};
}

/* ===================== spin ===================== */
const pkey = x => (x.src && x.src!=="library") ? x.src+":"+x.id : "lib:"+x.id;
function spinBase(){
  const okT=x=>spin.type==="all"?(x.type==="anime"||x.type==="movie"):x.type===spin.type;
  if(spin.src==="live"){
    const seen=new Set(), out=[];
    ["aniTrending","tmdbTrending","aniSeason","tmdbHorror","aniHorror","tmdbFreshHorror"].forEach(id=>((home.rails[id]&&home.rails[id].items)||[]).forEach(r=>{ const k=r.src+":"+r.id; if(okT(r)&&!seen.has(k)){ seen.add(k); out.push(r); } }));
    return out.slice(0,40);
  }
  return store.items.filter(i=>okT(i)&&(spin.src!=="fav"||i.fav));
}
function spinPool(){ return spinBase().filter(i=>spin.genre==="any"||i.genres.includes(spin.genre)); }
let wheelAngle=0, wheelFrame=null;
function drawWheel(pool,angle=wheelAngle){
  const canvas=$("#wheelCanvas"); if(!canvas) return;
  const ctx=canvas.getContext("2d"); if(!ctx) return;
  const size=canvas.width, cx=size/2, cy=size/2, radius=size/2-8;
  ctx.clearRect(0,0,size,size);
  if(!pool.length){
    ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.fillStyle="#241830";ctx.fill();
    ctx.strokeStyle="#5a4370";ctx.lineWidth=8;ctx.stroke();
    ctx.fillStyle="#f2edf8";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="700 25px Manrope, sans-serif";ctx.fillText(spin.src==="live"?"LOADING":"ADD TITLES",cx,cy-8);
    ctx.font="500 18px Manrope, sans-serif";ctx.fillStyle="#b6abc8";ctx.fillText(spin.src==="live"?"trending rows":"to spin",cx,cy+25);
    const cap=$("#wheelCaption");if(cap)cap.textContent=spin.src==="live"?"Trending rows haven't loaded yet":spin.src==="fav"?"Star some anime or movies to spin your favourites":"Save some anime or movies to spin";
    return;
  }
  const slice=Math.PI*2/pool.length;
  for(let i=0;i<pool.length;i++){
    const item=pool[i], start=angle+i*slice-Math.PI/2, finish=start+slice;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,radius,start,finish);ctx.closePath();
    ctx.fillStyle=item.type==="anime"?(i%2?"#b04a86":"#e264a8"):(i%2?"#7c4bc2":"#9d6cf0");
    ctx.fill();ctx.strokeStyle="rgba(12,8,18,.88)";ctx.lineWidth=3;ctx.stroke();
    if(pool.length<=28){
      ctx.save();ctx.translate(cx,cy);ctx.rotate(start+slice/2);
      ctx.textAlign="right";ctx.textBaseline="middle";
      const fontSize=pool.length>18?14:pool.length>12?16:19;
      ctx.font=`700 ${fontSize}px Manrope, sans-serif`;
      ctx.fillStyle="#fff";ctx.shadowColor="rgba(0,0,0,.55)";ctx.shadowBlur=3;
      let label=item.title;
      const maxChars=pool.length>16?15:20;
      if(label.length>maxChars)label=label.slice(0,maxChars-1)+"…";
      ctx.fillText(label,radius-22,0);
      ctx.restore();
    }
  }
  ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.strokeStyle="#f3c454";ctx.lineWidth=8;ctx.stroke();
  const cap=$("#wheelCaption");if(cap)cap.textContent=`${pool.length} ${pool.length===1?"title":"titles"} on the wheel`;
}
function paintSpin(item){
  const w=$("#spinWin"); if(!w) return;
  const base=spinBase(), gs=[...new Set(base.flatMap(i=>i.genres||[]))].sort();
  if(spin.genre!=="any"&&!gs.includes(spin.genre)) spin.genre="any";
  const sel=$("#spinGenre"); if(sel) sel.innerHTML=`<option value="any">Any genre</option>`+gs.map(g=>`<option value="${esc(g)}" ${spin.genre===g?"selected":""}>${esc(g)}</option>`).join("");
  const pool=spinPool();
  if(item===undefined) item = spin.pick ? (pool.find(p=>pkey(p)===pkey(spin.pick))||null) : null;
  drawWheel(pool);
  const acts=$("#spinActs");
  if(!item){
    w.style.removeProperty("--c"); if(acts) acts.innerHTML="";
    w.innerHTML = pool.length ? `<div class="spin-text"><div class="eyebrow">${pool.length} in the pool</div><div class="t">Can't decide? Spin.</div></div>`
      : `<div class="spin-text"><div class="eyebrow">Pool is empty</div><div class="t" style="font-size:15px">${spin.src==="live"?"Trending rows are still loading, or couldn't load. Try Refresh live.":spin.src==="fav"?"Star some anime or movies, or switch to My collection.":"Save some anime or movies to your collection."}</div></div>`;
    return;
  }
  const lib=!item.src||item.src==="library";
  w.style.setProperty("--c",TYPES[item.type].color);
  w.innerHTML = `${poster(item)}<div class="spin-text"><span class="type-pill" style="color:${TYPES[item.type].color}">${TYPES[item.type].label}${lib?"":" · "+esc(srcName(item.src))}</span><div class="t">${esc(item.title)}</div><div class="meta" style="margin-top:4px">${item.year?`<span>${item.year}</span>`:""}${unitLine(item)}<span>${(item.genres||[]).slice(0,2).map(esc).join(" · ")}</span></div></div>`;
  if(acts) acts.innerHTML = watchBtns(item,true) + (lib?`<button class="btn btn-sm" data-act="openInfo" data-id="${item.id}">Details</button>`:`<button class="btn btn-sm" data-act="openInfo" data-k="${esc(item.src+":"+item.id)}">Details</button>`) + `<button class="btn btn-sm btn-ghost" data-act="shareTitle" ${lib?`data-id="${item.id}"`:`data-k="${esc(item.src+":"+item.id)}"`}>Share card</button>`;
}
function doSpin(){
  const pool=spinPool(); if(!pool.length){ toast(spin.src==="live"?"Trending rows haven't loaded yet":"Save some anime or movies first"); return; }
  const w=$("#spinWin");
  const pick=pool[Math.floor(Math.random()*pool.length)];
  const finish=()=>{
    if(w)w.classList.remove("rolling");
    spin.pick=pick; paintSpin(pick);
    const cap=$("#wheelCaption");if(cap)cap.textContent=`Tonight's pick: ${pick.title}`;
  };
  if(w)w.classList.add("rolling");
  const slice=Math.PI*2/pool.length;
  const winnerIndex=pool.findIndex(i=>pkey(i)===pkey(pick));
  const targetNorm=((-(winnerIndex+.5)*slice)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  const start=wheelAngle, turns=Math.PI*2*(5+Math.random()*3);
  const delta=turns+((targetNorm-((start+turns)%(Math.PI*2)) +Math.PI*2)%(Math.PI*2));
  const duration=reduced?0:4200, startTime=performance.now();
  if(wheelFrame)cancelAnimationFrame(wheelFrame);
  const animate=now=>{
    const t=duration?Math.min(1,(now-startTime)/duration):1;
    const eased=1-Math.pow(1-t,4);
    wheelAngle=start+delta*eased;
    drawWheel(pool,wheelAngle);
    if(t<1) wheelFrame=requestAnimationFrame(animate);
    else {wheelFrame=null;wheelAngle=targetNorm;drawWheel(pool,wheelAngle);finish();}
  };
  if(duration===0)animate(startTime);else wheelFrame=requestAnimationFrame(animate);
}

function doImport(){

  const arr=Array.isArray(data)?data:Array.isArray(data.items)?data.items:null;
  if(!arr){ msg.textContent="No titles found. A NEXUS backup has an \"items\" list."; return; }
  const items=arr.map(clean).filter(Boolean);
  const skipped=arr.length-items.length;
  const replace=$("#im-replace").checked;
  if(replace){ store.items=items; if(data.settings) store.settings=normSettings(data.settings); }
  else{
    let added=0, updated=0;
    for(const it of items){
      const ex=store.items.findIndex(x=>x.id===it.id||(x.type===it.type&&norm(x.title)===norm(it.title)));
      if(ex<0){ store.items.push(it); added++; } else if(it.updated>=store.items[ex].updated){ store.items[ex]=Object.assign(it,{id:store.items[ex].id}); updated++; }
    }
    save(); render(); toast(`Imported: ${added} new, ${updated} updated${skipped?`, ${skipped} skipped`:""}`); return;
  }
  save(); render(); toast(`Restored ${items.length} titles${skipped?`, ${skipped} skipped`:""}`);
}

/* --- keys + cache (separate storage keys; never touch nexus.v1) --- */
const memKeys = {}; let memCache = {};
function keyGet(name){ try{ const k=localStorage.getItem(name); return (k==null?(memKeys[name]||""):k).trim(); }catch(e){ return memKeys[name]||""; } }
function keySet(name,v){ memKeys[name]=v; try{ v ? localStorage.setItem(name,v) : localStorage.removeItem(name); }catch(e){} }
const getKey = () => keyGet(TMDB_KEY_STORE);
function cacheAll(){ try{ const r=localStorage.getItem(CACHE_STORE); return r?JSON.parse(r):memCache; }catch(e){ return memCache; } }
function cacheGet(k,ttl){ const c=cacheAll()[k]; return c && Date.now()-c.t<ttl ? c : null; }
function cachePut(k,data){
  const all=cacheAll(); all[k]={t:Date.now(),data};
  Object.keys(all).sort((a,b)=>all[b].t-all[a].t).slice(CACHE_MAX).forEach(x=>delete all[x]);
  memCache=all;
  try{ localStorage.setItem(CACHE_STORE,JSON.stringify(all)); }catch(e){ try{ localStorage.removeItem(CACHE_STORE); }catch(_){} }
}
function cacheClear(){ memCache={}; try{ localStorage.removeItem(CACHE_STORE); }catch(e){} }

/* --- HTTP --- */
class ApiError extends Error{ constructor(msg,code,api){ super(msg); this.code=code; this.api=api; } }
async function request(url,o){
  const ctl = typeof AbortController!=="undefined" ? new AbortController() : null;
  const timer = setTimeout(()=>ctl&&ctl.abort(),15000);
  let res;
  try{ res = await fetch(url,{method:o.body?"POST":"GET",headers:o.headers||{},body:o.body||undefined,signal:ctl?ctl.signal:undefined}); }
  catch(e){ const t=e&&e.name==="AbortError"; throw new ApiError(t?"timeout":"network",t?"timeout":"net",o.api); }
  finally{ clearTimeout(timer); }
  let data=null, parsed=true;
  try{ data = await res.json(); }catch(e){ parsed=false; }
  if(!res.ok){
    const er=new ApiError("http "+res.status,res.status,o.api);
    er.retryAfter = +(res.headers.get("Retry-After")||0) || 0;
    er.detail = data && data.errors && data.errors[0] && data.errors[0].message || "";
    throw er;
  }
  if(!parsed) throw new ApiError("parse","parse",o.api);
  if(data && Array.isArray(data.errors) && data.errors.length && !data.data){ throw new ApiError(String(data.errors[0].message||"error"), data.errors[0].status||"gql", o.api); }
  return data;
}
const NEXUS_API = "https://nexus-api.prakruthiii20.workers.dev";
async function tmdb(path,params,o){
  o=o||{};
  const qs=new URLSearchParams(Object.assign({language:"en-US"},params||{}));
  const ck="tmdb:"+path+"?"+qs;
  if(!o.force){ const c=cacheGet(ck,o.ttl||TTL_LIST); if(c) return {data:c.data,cachedAt:c.t}; }
  const raw=await request(NEXUS_API+"/tmdb"+path+"?"+qs,{headers:{accept:"application/json"},api:"TMDB"});
  const data=o.map?o.map(raw):raw; if(!o.noCache) cachePut(ck,data); return {data,cachedAt:null};
}
let aQueue=Promise.resolve(), aLast=0;
async function anilist(query,variables,o){
  o=o||{}; const ck="anilist:"+hash(query)+":"+JSON.stringify(variables||{});
  if(!o.force){ const c=cacheGet(ck,o.ttl||TTL_LIST); if(c) return {data:c.data,cachedAt:c.t}; }
  const run=async()=>{ const w=aLast+ANILIST_GAP-Date.now(); if(w>0) await sleep(w); aLast=Date.now();
    return request(ANILIST_URL,{headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query,variables:variables||{}}),api:"AniList"}); };
  const p=aQueue.then(run,run); aQueue=p.catch(()=>{});
  const raw=await p; const data=o.map?o.map(raw.data||{}):raw.data; cachePut(ck,data); return {data,cachedAt:null};
}
async function rawg(path,params,o){
  o=o||{};
  const qs=new URLSearchParams(params||{}); const ck="rawg:"+path+"?"+qs;
  if(!o.force){ const c=cacheGet(ck,o.ttl||TTL_LIST); if(c) return {data:c.data,cachedAt:c.t}; }
  const raw=await request(NEXUS_API+"/rawg"+path+"?"+qs,{api:"RAWG"});
  const data=o.map?o.map(raw):raw; if(!o.noCache) cachePut(ck,data); return {data,cachedAt:null};
}

function mapTmdb(m,gmap){

function findDup(r){

    (r.mal ? store.items.find(i=>i.type==="anime"&&i.ext&&((i.ext.src==="mal"&&i.ext.id===r.mal)||i.ext.mal===r.mal)) : null) ||
    store.items.find(i=>i.type===r.type && (norm(i.title)===norm(r.title)||(r.altTitle&&norm(i.title)===norm(r.altTitle))) && (i.year==null||r.year==null||Math.abs(i.year-r.year)<=1));
}
function liveScore(r,prof,active){
  const n=Math.max(1,r.genres.length); let s=0; r.genres.forEach(g=>s+=(prof.w[g]||0)); s/=Math.sqrt(n);
  const hits=active.filter(x=>r.genres.includes(x.tag)).length; s+=hits*.3;
  return {s,pct:Math.max(38,Math.min(99,Math.round(62+36*Math.tanh(s/1.6)))),hits};
}
function liveWhy(r,dup,prof,sc,active){
  const parts=[];
  if(dup) parts.push(`In your collection${dup.fav?" as a <b>favourite</b>":""}${dup.rating!=null?`, rated ${dup.rating}/10`:""}. Saving again won't create a copy.`);
  const shared=it=>it.genres.filter(g=>r.genres.includes(g));
  let best=null,bv=0,worst=null,wv=0;
  for(const it of store.items){
    if(it===dup||it.rating==null) continue; const sh=shared(it); if(!sh.length) continue;
    if(it.rating>=7&&sh.length*it.rating>bv){ bv=sh.length*it.rating; best={it,sh}; }
    if(it.rating<=5&&sh.length*(6-it.rating)>wv){ wv=sh.length*(6-it.rating); worst={it,sh}; }
  }
  if(!dup){
    if(best) parts.push(`Because you rated <b>${esc(best.it.title)}</b> ${best.it.rating}/10. Shared: ${best.sh.slice(0,3).map(esc).join(", ")}.`);
    else if(sc.s<-.2&&worst) parts.push(`Ranks lower for you: it overlaps with <b>${esc(worst.it.title)}</b>, which you rated ${worst.it.rating}/10.`);
    else if(!prof.signals) parts.push(`Rate a few titles in your library and NEXUS will explain how this fits your taste.`);
    else parts.push(`Little overlap with what you've rated so far, so this is a chance to try something new.`);
  }
  const fh=active.filter(x=>r.genres.includes(x.tag));
  if(fh.length) parts.push(`Matches your filter${fh.length>1?"s":""}: ${fh.map(x=>x.label.toLowerCase()).join(", ")}.`);
  if(r.score!=null&&r.votes) parts.push(r.src==="rawg"?`RAWG players rate it ${r.score5}/5.`:`${srcName(r.src)} users rate it ${r.score}/10.`);
  return parts.join(" ");
}

function rowMsg(row){
  if(!row.url.trim()) return row.label.trim()?{cls:"",text:""}:{cls:"",text:""};
  const n=normalizeUrl(row.url);
  if(!n.ok) return {cls:"bad",text:n.msg};
  if(n.insecure) return {cls:"warn",text:"This link isn't encrypted (http). Use https:// if the site supports it.",https:true};
  return {cls:"good",text:"Opens "+n.host+" in a new tab."};
}
function paintLinks(focus){
  const c=linksCtx; if(!c) return;

function syncLinkRows(){
  if(!linksCtx) return;
  document.querySelectorAll("#linksForm .lrow").forEach(el=>{ const row=linksCtx.rows.find(r=>r.id===el.dataset.row); if(!row) return;
    row.label=el.querySelector('[data-lf="label"]').value; row.url=el.querySelector('[data-lf="url"]').value; });
}
function saveLinks(){
  syncLinkRows(); const c=linksCtx; if(!c) return;
  const out=[], errs=[];
  c.rows.forEach(row=>{
    const label=row.label.trim(), url=row.url.trim();
    if(!label&&!url) return;
    if(!url){ errs.push(`“${label}” needs a web address.`); return; }
    const n=normalizeUrl(url); if(!n.ok){ errs.push(`${label||"A link"}: ${n.msg}`); return; }
    out.push({id:row.id,label:label||"Link",url:n.url});
  });
  if(errs.length){ $("#linksErr").textContent=errs[0]+(errs.length>1?` (${errs.length-1} more)`:""); paintLinksMsgs(); return; }
  if(out.length>20){ $("#linksErr").textContent="Keep it to 20 links per title."; return; }
  const item=byId(c.id);
  if(item){ item.links=out; item.updated=Date.now(); save(); }
  if(modalItem&&modalItem.id===c.id){ modalItem.links=out.map(l=>Object.assign({},l)); const ml=document.getElementById("mLinks"); if(ml) ml.innerHTML=linksHTML(modalItem)||`<span class="note">No links yet.</span>`; }
  closeLinks();
  toast(out.length?`Saved ${out.length} link${out.length>1?"s":""}${item||!modalItem?"":". Save the title to keep them"}`:"Links removed");
  if(view==="home") paintHome(); else if(view==="live") paintLive(); else if(TYPES[view]) renderLibrary(view);
  if(sheetKey) openDetail(sheetKey,true);
}
function paintLinksMsgs(){
  if(!linksCtx) return;
  document.querySelectorAll("#linksForm .lrow").forEach(el=>{ const row=linksCtx.rows.find(r=>r.id===el.dataset.row); if(!row) return;
    const m=rowMsg(row), box=el.querySelector(".lrow-msg"); box.className="lrow-msg "+m.cls;

}

async function matchArt(){
  const box=document.getElementById("matchBox"); if(!box||!modalItem) return;

  box.innerHTML=`<div class="live-status" style="margin:8px 0 0"><span class="spinner" aria-hidden="true"></span><span>Searching ${{movie:"TMDB",anime:"AniList",game:"RAWG"}[i.type]}…</span></div>`;
  try{
    let items;
    if(i.type==="movie"){ const map=await tmdbMapper(); items=(await tmdb("/search/movie",{query:q,include_adult:"false"},{map})).data.items; }
    else if(i.type==="anime"){ items=(await anilist(Q_PAGE,{page:1,perPage:8,search:q,sort:["SEARCH_MATCH"]},{map:anilistPageMap})).data.items; }
    else { items=(await rawg("/games",{search:q,search_precise:"true",page_size:"8"},{map:rawgMap})).data.items; }
    reg(items);
    items=items.filter(r=>safeImg(r.poster)).sort((a,b)=>(i.year?(Math.abs((a.year||0)-i.year)-Math.abs((b.year||0)-i.year)):0)).slice(0,6);

  }catch(e){ box.innerHTML=`<p class="note" style="margin-top:8px;color:var(--fg)">${esc(errMsg(e))}</p>`; }

function matchPick(k){
  const r=liveFind(k); if(!r||!modalItem) return;
  readForm();

/* --- events for v3 features --- */
document.addEventListener("click", async e=>{
  if(e.target.closest("a[href]")) return;

  if(el.dataset.overlay&&e.target!==el) return;
  switch(el.dataset.act){
    case "liveTab": live.tab=el.dataset.v; live.status="idle"; live.results=[]; closeSheet(); if(view!=="live") setView("live"); else render(); break;
    case "liveMode": live.mode[live.tab]=el.dataset.v; live.status="idle"; live.results=[]; render(); break;
    case "liveFilter": { if(el.disabled) break; const f=live.f[live.tab], id=el.dataset.v; f.on=f.on.includes(id)?f.on.filter(x=>x!==id):f.on.concat(id); el.setAttribute("aria-pressed",String(f.on.includes(id))); queueLive(); break; }
    case "liveClear": live.f[live.tab]=blankF(); live.status="idle"; render(); break;
    case "liveRefresh": liveLoad(true); break;
    case "liveMore": liveLoad(false,true); break;
    case "liveAdd": liveAdd(liveFind(el.dataset.k)); break;
    case "liveOv": { const p=document.getElementById("ov-"+el.dataset.k); if(p){ const o=p.classList.toggle("open"); el.textContent=o?"Show less":"Read more"; } break; }
    case "openLive": e.stopPropagation(); if(!maybeWatch(liveFind(el.dataset.k))) openDetail(el.dataset.k); break;
    case "sheetClose": closeSheetUI(); break;
    case "homeRefresh": loadHome(true); break;
    case "heroGo": home.heroIdx=+el.dataset.i; paintHero(); break;
    case "railScroll": { const tr=el.closest(".shelf").querySelector(".rail-track"); if(tr) tr.scrollBy({left:(+el.dataset.dir)*Math.max(240,tr.clientWidth*.85),behavior:reduced?"auto":"smooth"}); break; }
    case "railSee": { const d=RAILS.find(r=>r.id===el.dataset.rail); if(!d||!d.see) break; const [tab,mode,fl]=d.see; live.tab=tab; live.mode[tab]=mode; live.f[tab]=Object.assign(blankF(),{on:fl.slice()}); live.status="idle"; setView("live"); break; }
    case "links": {
      e.stopPropagation();
      if(el.dataset.from==="modal"&&modalItem){ readForm(); openLinks(modalItem); }
      else openLinks(byId(el.dataset.id));
      break; }
    case "linksClose": closeLinks(); break;
    case "linkDel": { syncLinkRows(); linksCtx.rows=linksCtx.rows.filter(r=>r.id!==el.dataset.row); paintLinks(); break; }
    case "linkPreset": { syncLinkRows(); const empty=linksCtx.rows.find(r=>!r.url.trim()&&!r.label.trim()); if(empty) empty.label=el.dataset.v; else linksCtx.rows.push({id:uid(),label:el.dataset.v,url:""}); paintLinks(true); break; }
    case "linkHttps": { syncLinkRows(); const row=linksCtx.rows.find(r=>r.id===el.dataset.row); if(row) row.url=row.url.trim().replace(/^http:\/\//i,"https://"); paintLinks(); break; }

    case "recAdd": if(sheetKey) closeSheet(); break;

/* ===================== v4: watch buttons ===================== */
const PLAY_SVG = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>`;
const WATCH_KEYS = /\{(title|year|type|tmdb|anilist|mal|query)\}/g;
const pname = id => (WATCH.find(p=>p.id===id)||WATCH[0]).name;
function watchIds(x){
  const e = x.ext || {};
  return {
    tmdb: x.src==="tmdb" ? x.id : (e.src==="tmdb" ? e.id : ""),
    anilist: x.src==="anilist" ? x.id : (e.src==="anilist" ? e.id : ""),
    mal: x.mal || (e.src==="mal" ? e.id : e.mal) || ""
  };
}
function fillPattern(tpl, vals){
  let missing = "";
  const out = tpl.replace(WATCH_KEYS, (m,k)=>{ const v = vals[k]; if(v===""||v==null){ missing = missing||k; return ""; } return encodeURIComponent(String(v)); });
  return {out, missing};
}
function watchLink(pid, x){
  const tpl = (store.settings.watch||{})[pid];
  if(!tpl) return {setup:true};
  const ids = watchIds(x);
  const vals = {title:x.title||"", year:x.year||"", type:x.type==="anime"?"anime":x.type==="movie"?"movie":"game", tmdb:ids.tmdb, anilist:ids.anilist, mal:ids.mal, query:[x.title,x.year].filter(Boolean).join(" ")};
  const f = fillPattern(tpl, vals);
  if(f.missing){
    const what = {tmdb:"a TMDB ID", anilist:"an AniList ID", mal:"a MyAnimeList ID", year:"a release year", title:"a title"}[f.missing] || f.missing;
    return {err:`This title has no ${what}, which your ${pname(pid)} link pattern needs. Use Edit → Find artwork to link it, or use {title} in the pattern.`};
  }
  const n = normalizeUrl(f.out);
  return n.ok ? {url:n.url, host:n.host} : {err:`Your ${pname(pid)} link pattern doesn't make a valid web address. Fix it in Settings.`};
}
function watchBtns(x, both){
  if(!x || (x.type!=="anime" && x.type!=="movie")) return "";
  const sel = store.settings.watchSel;
  const list = both ? WATCH : WATCH.filter(p=>p.id===sel);
  return `<span class="watch">${list.map(p=>{
    const l = watchLink(p.id, x), on = p.id===sel ? " on" : "";
    if(l.url) return `<a class="wbtn${on}" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer nofollow" referrerpolicy="no-referrer" title="Open on ${esc(l.host)}">${PLAY_SVG}<span>${esc(p.name)}</span></a>`;
    if(l.setup) return `<button type="button" class="wbtn setup" data-act="watchSetup" title="Add your ${esc(p.name)} link pattern in Settings">+ Set up ${esc(p.name)}</button>`;
    return `<button type="button" class="wbtn warn" data-act="watchErr" data-msg="${esc(l.err)}">${PLAY_SVG}<span>${esc(p.name)}</span></button>`;
  }).join("")}</span>`;
}
function watchPicker(){
  return `<div class="seg wsel" role="group" aria-label="Default watch button">${WATCH.map(p=>`<button type="button" data-act="watchSel" data-v="${p.id}" aria-pressed="${store.settings.watchSel===p.id}">▶ ${esc(p.name)}</button>`).join("")}</div>`;
}
function watchMsg(tpl){
  if(!tpl) return "Not set yet. Its button shows “Set up” until you add a pattern.";
  const f = fillPattern(tpl, {title:"Hereditary", year:"2018", type:"movie", tmdb:"493922", anilist:"1535", mal:"1535", query:"Hereditary 2018"});
  const n = normalizeUrl(f.out);
  if(!n.ok) return esc(n.msg);
  if(!/\{(title|year|type|tmdb|anilist|mal|query)\}/.test(tpl)) return `Opens ${esc(n.host)}. Tip: add {title} so each button searches for that title.`;
  return `Example: opens ${esc(n.host)}${n.insecure?" (not encrypted: use https if you can)":""}.`;
}

    <p class="note" style="margin:0">Paste the exact web address each site uses for its search or title pages, with placeholders where the title goes. NEXUS only builds addresses from your patterns; it never invents them, and it can't check whether a site is online or has a given title.</p>

function startFX(){
  const layer=document.getElementById("bgLayer");
  if(layer) layer.style.backgroundImage=`url("${BG_DATA}")`;
  const c=document.getElementById("fx"); if(!c||reduced) return;
  const ctx=c.getContext("2d"); if(!ctx) return;
  let W=0, H=0, petals=[], motes=[], px=0, py=0, tx=0, ty=0, last=0, lastT="";
  const petal=(()=>{ const s=document.createElement("canvas"); s.width=s.height=64; const g=s.getContext("2d"); g.translate(32,32);
    const gr=g.createLinearGradient(-18,-28,18,28); gr.addColorStop(0,"#ffe1ef"); gr.addColorStop(.55,"#ffa3cf"); gr.addColorStop(1,"#e9649f");
    g.fillStyle=gr; g.beginPath(); g.moveTo(0,-26); g.bezierCurveTo(22,-22,22,12,0,28); g.bezierCurveTo(-22,12,-22,-22,0,-26); g.fill();
    g.globalCompositeOperation="destination-out"; g.beginPath(); g.moveTo(-6,-30); g.lineTo(0,-19); g.lineTo(6,-30); g.closePath(); g.fill(); return s; })();
  const mote=(()=>{ const s=document.createElement("canvas"); s.width=s.height=32; const g=s.getContext("2d"); const gr=g.createRadialGradient(16,16,0,16,16,16);
    gr.addColorStop(0,"rgba(255,235,248,1)"); gr.addColorStop(.25,"rgba(255,140,205,.75)"); gr.addColorStop(1,"rgba(169,139,255,0)"); g.fillStyle=gr; g.fillRect(0,0,32,32); return s; })();
  const mk=init=>({x:Math.random()*(W+160), y:init?Math.random()*H:-30-Math.random()*60, s:7+Math.random()*9, vy:.35+Math.random()*.7, vx:-.15-Math.random()*.45, a:Math.random()*6.28, va:(Math.random()-.5)*.03, ph:Math.random()*6.28, fl:Math.random()*6.28, o:.5+Math.random()*.45, z:.6+Math.random()*.8});
  function size(){
    const dpr=Math.min(1.5,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(34,Math.max(10,W*H/46000)));
    petals=Array.from({length:n},()=>mk(true));
    motes=Array.from({length:Math.round(n*.9)},()=>({x:Math.random()*W, y:Math.random()*H, r:1+Math.random()*2.2, vy:-.08-Math.random()*.22, ph:Math.random()*6.28, sp:.01+Math.random()*.03}));
  }
  size();
  addEventListener("resize",()=>{ clearTimeout(size._t); size._t=setTimeout(size,200); });
  addEventListener("pointermove",e=>{ if(e.pointerType==="mouse"){ tx=e.clientX/W-.5; ty=e.clientY/H-.5; } },{passive:true});

    requestAnimationFrame(frame);
    if(document.hidden) { last=t; return; }
    const dt=Math.min(3,last?(t-last)/16.7:1); last=t;
    px+=(tx-px)*.05; py+=(ty-py)*.05;
    const sy=Math.min(14,(window.scrollY||0)*.03);
    const tr=`translate3d(${(-px*10).toFixed(1)}px,${(-py*6-sy).toFixed(1)}px,0) scale(1.02)`;
    if(layer && tr!==lastT){ layer.style.transform=tr; lastT=tr; }
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    for(const m of motes){ m.y+=m.vy*dt; m.ph+=m.sp*dt; if(m.y<-12){ m.y=H+12; m.x=Math.random()*W; }
      ctx.globalAlpha=(.3+.7*Math.abs(Math.sin(m.ph)))*.6; const d=m.r*7; ctx.drawImage(mote,m.x-d/2-px*6,m.y-d/2,d,d); }
    ctx.globalCompositeOperation="source-over";
    for(const p of petals){
      p.ph+=.02*dt; p.y+=p.vy*p.z*dt; p.x+=(p.vx+Math.sin(p.ph)*.55)*p.z*dt; p.a+=p.va*dt; p.fl+=.03*dt;
      if(p.y>H+40||p.x<-50){ Object.assign(p,mk(false)); }
      const s=p.s*p.z*2; ctx.save(); ctx.globalAlpha=p.o; ctx.translate(p.x-px*14*p.z,p.y-py*8*p.z); ctx.rotate(p.a); ctx.scale(Math.max(.2,Math.abs(Math.cos(p.fl))),1); ctx.drawImage(petal,-s/2,-s/2,s,s); ctx.restore();
    }
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
}

const ROUTE_VIEWS = VIEWS.concat(["anime","movie","game"]);

const routeUrl = (v,q) => "#/"+v+(v==="search"&&q?"?q="+encodeURIComponent(q):"");
function navTo(url, replace, state){
  try{ history[replace?"replaceState":"pushState"](Object.assign({nx:1},state||{}), "", url); }catch(e){}
  navUrl=location.href; navState=history.state;
}
function parseRoute(h){
  h = h==null ? location.hash : h;
  if(!h || h.slice(0,2)!=="#/") return null;
  const qi=h.indexOf("?"), path=qi<0?h.slice(2):h.slice(2,qi), qs=qi<0?"":h.slice(qi+1);
  const dec=s=>{ try{ return decodeURIComponent(s.replace(/\+/g," ")); }catch(e){ return s; } };
  const parts=path.split("/").map(dec);
  const q=/^q=/.test(qs)?dec(qs.slice(2)).slice(0,120):"";
  if(parts[0]==="title"){
    const src=parts[1], id=parts.slice(2).join("/");
    const ok = (src==="tmdb"||src==="anilist"||src==="rawg") ? /^\d{1,10}$/.test(id) : src==="lib" ? /^[\w-]{1,40}$/.test(id) : src==="catalog" ? /^(anime|movie|game):[a-z0-9]{1,160}$/.test(id) : false;
    return ok ? {view:null, title:{src,id}, q:""} : null;
  }
  return ROUTE_VIEWS.includes(parts[0]) ? {view:parts[0], title:null, q} : null;
}
function titleUrl(r){
  if(r.src==="lib") return "#/title/lib/"+encodeURIComponent(r.id);
  if(r.src==="catalog") return "#/title/catalog/"+encodeURIComponent(r.key||r.id);

}
const _closeSheetDom = closeSheet;
closeSheet = function(){ const had=!!sheetKey; _closeSheetDom(); if(had) restoreFocus("sheet"); if(/^#\/title\//.test(location.hash)) navTo(routeUrl(view, view==="search"?searchUI.q:""), true); };
function closeSheetUI(){

  else closeSheet();
}
function applyRoute(){
  if(/^#match=/.test(location.hash)){ if(sheetKey){ _closeSheetDom(); } if(readHash()){ setView("match",{replace:true}); runMatch(); } return; }
  const r=parseRoute();
  if(!r){ if(sheetKey){ _closeSheetDom(); restoreFocus("sheet"); } return; }
  if(r.title){ openTitle(r.title.src, r.title.id, {fromRoute:true}); return; }
  if(sheetKey){ _closeSheetDom(); restoreFocus("sheet"); }
  if(r.view==="search" && r.q!==searchUI.q){ searchUI.q=r.q; searchUI.groups={}; }
  if(r.view!==view || r.view==="search") setView(r.view,{fromRoute:true});
}
addEventListener("popstate", ()=>{
  if(dialogOpen()){ closeDialogs(); try{ history.pushState(navState, "", navUrl); }catch(e){} return; }

});

function runSearch(force){
  clearTimeout(searchTimer);
  const q=searchUI.q.trim(), id=++searchUI.seq;
  searchUI.groups={}; paintSearch();
  if(q.length<2) return;
  const done=(src,st)=>{ if(id!==searchUI.seq) return; searchUI.groups[src]=st; if(view==="search") paintSearch(); };
  const o={force:!!force};
  tmdbMapper().then(map=>tmdb("/search/movie",{query:q,include_adult:"false"},Object.assign({map},o)))
    .then(r=>done("tmdb",{status:"ok",items:reg(r.data.items.slice(0,18))})).catch(e=>done("tmdb",{status:"error",error:errMsg(e)}));
  anilist(Q_PAGE,{page:1,perPage:18,search:q,sort:["SEARCH_MATCH"]},Object.assign({map:anilistPageMap},o))
    .then(r=>done("anilist",{status:"ok",items:reg(r.data.items)})).catch(e=>done("anilist",{status:"error",error:errMsg(e)}));
  rawg("/games",{search:q,search_precise:"true",page_size:"16"},Object.assign({map:rawgMap},o))
    .then(r=>done("rawg",{status:"ok",items:reg(r.data.items)})).catch(e=>done("rawg",{status:"error",error:errMsg(e)}));
}

/* ===================== v5: watch-site click behaviour ===================== */
function maybeWatch(x){
  if(!store.settings.clickWatch || !x || (x.type!=="anime" && x.type!=="movie")) return false;
  const l=watchLink(store.settings.watchSel, x);
  if(!l.url) return false;
  window.open(l.url, "_blank", "noopener,noreferrer");
  toast(`Opening ${pname(store.settings.watchSel)} in a new tab`);
  return true;
}
const WATCH_SAMPLES = {movie:{title:"Hereditary",year:2018,type:"movie",src:"tmdb",id:493922}, anime:{title:"Death Note",year:2006,type:"anime",src:"anilist",id:1535,mal:1535}};

/* ===================== v5: events ===================== */
document.addEventListener("click", e=>{
  if(e.target.closest("a[href]")) return;
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.overlay&&e.target!==el) return;
  switch(el.dataset.act){
    case "openLib": { const it=byId(el.dataset.id); if(it && !maybeWatch(it)) openDetail("lib:"+it.id); break; }
    case "openInfo": e.stopPropagation(); if(el.dataset.id) openDetail("lib:"+el.dataset.id); else if(el.dataset.k) openDetail(el.dataset.k); break;
    case "fav": if(sheetKey) setTimeout(()=>{ if(sheetKey) openDetail(sheetKey,true); },0); break;
    case "detailRetry": { const dk=el.dataset.dk; detailErr.delete(dk); if(sheetKey) openDetail(sheetKey,true); break; }
    case "searchRetry": runSearch(true); break;
    case "skip": { const m=document.getElementById("main"); if(m) m.focus(); break; }
    case "watchTest": {
      const i=document.getElementById("wt-"+el.dataset.v), tpl=(i?i.value:"").trim(); if(!tpl){ toast("Paste a link pattern first"); break; }
      const s=/\{(anilist|mal)\}/.test(tpl)?WATCH_SAMPLES.anime:WATCH_SAMPLES.movie;
      const saved=store.settings.watch[el.dataset.v]; store.settings.watch[el.dataset.v]=tpl; const l=watchLink(el.dataset.v,s); store.settings.watch[el.dataset.v]=saved;
      if(!l.url){ toast(l.err||"That pattern doesn't make a valid web address"); break; }
      window.open(l.url,"_blank","noopener,noreferrer"); toast(`Opened a test search for ${s.title}. Check that the page is right.`); break; }
  }
});
document.addEventListener("input", e=>{
  if(e.target.id!=="uQ") return;
  searchUI.q=e.target.value.slice(0,120);
  navTo(routeUrl("search",searchUI.q.trim()), true);
  searchUI.groups={}; searchUI.seq++; paintSearch(); queueSearch();
});
document.addEventListener("submit", e=>{ if(e.target.id!=="uSearch") return; e.preventDefault(); const i=document.getElementById("uQ"); if(i){ searchUI.q=i.value.slice(0,120); i.blur(); } runSearch(false); });
document.addEventListener("keydown", e=>{
  if(e.key!=="/" || e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".overlay")) return;
  const t=e.target; if(t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  e.preventDefault();
  if(view==="search"){ const i=document.getElementById("uQ"); if(i){ i.focus(); i.select(); } } else setView("search");
});

/* ===================== boot ===================== */
load();
startFX();
const fromHash=readHash();
const route0=fromHash?null:parseRoute();
if(route0&&route0.view==="search") searchUI.q=route0.q;
setView(fromHash?"match":(route0&&route0.view)?route0.view:(TYPES[view]||VIEWS.includes(view)?view:"home"), {replace:true});
if(route0&&route0.title) openTitle(route0.title.src, route0.title.id);
if(fromHash) runMatch();
})();
</script>
