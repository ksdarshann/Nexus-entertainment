<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a12">
<title>NEXUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app shell — slim command rail on the left (bottom dock on phones), working canvas on the right.
   Each medium owns one hue: anime = sakura, horror/movies = blood, games = arc-cyan. Gold is reserved for ratings. */
:root{
  color-scheme: dark;
  --bg:#0c0a12;
  --surface:#14111c;
  --surface-2:#1c1826;
  --surface-3:#262033;
  --line:#2e2840;
  --fg:#eeeaf6;
  --muted:#9b94b2;
  --faint:#6b6482;
  --anime:#ff7ab8;
  --movie:#ec4a52;
  --game:#3fc8e4;
  --gold:#f3c454;
  --ok:#5fd48d;
  --accent:#b9a2ff;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
  --rail:232px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--bg))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.brand-mark{width:30px;height:30px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.08em}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:-2px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;text-align:left;transition:background .15s,color .15s}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--surface-3);color:var(--fg)}
.nav-btn .dot{width:7px;height:7px;border-radius:50%;margin-left:auto;background:var(--c,transparent)}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.rail-foot{margin-top:auto;font-size:12px;color:var(--faint);padding:10px}
.main{min-width:0;padding-block:28px 60px;padding-inline:clamp(16px,3.4vw,44px)}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.view-title{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.4vw,34px);letter-spacing:.01em;margin-top:4px}
.view-title em{font-style:normal;color:var(--c,var(--accent))}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-weight:700;font-size:14px;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--surface-3);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn-primary:hover{background:#fff;border-color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--fg);border-color:transparent}
.btn-danger{color:var(--movie);border-color:color-mix(in srgb,var(--movie) 40%,var(--line))}
.btn-danger.armed{background:var(--movie);color:#fff;border-color:var(--movie)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.input,.select,textarea.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
.input:focus,.select:focus{border-color:var(--accent);outline:none}
textarea.input{resize:vertical;min-height:84px;font-family:var(--f-mono);font-size:12.5px;line-height:1.55}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1 1 220px;position:relative}
.toolbar .search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--faint)}
.toolbar .search .input{padding-left:36px}
.toolbar .select{width:auto;flex:0 1 180px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;transition:all .15s}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);border-color:var(--c,var(--accent));color:var(--fg)}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg)}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:flex;gap:14px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);transition:border-color .15s,transform .15s;cursor:pointer;min-width:0}
.card:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line));transform:translateY(-1px)}
.poster{flex:none;width:64px;height:90px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;color:rgba(255,255,255,.92);letter-spacing:.02em;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.poster::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.card-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.card-title{font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc,var(--faint))}
.status[data-s="active"]{--sc:var(--c);color:var(--fg)}
.status[data-s="done"]{--sc:var(--ok)}
.status[data-s="planned"]{--sc:var(--accent)}
.status[data-s="paused"]{--sc:var(--gold)}
.status[data-s="dropped"]{--sc:var(--faint)}
.rating{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--gold)}
.rating small{color:var(--faint);font-weight:500}
.bar{height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.card-foot .spacer{flex:1}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.tag.hit{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--fg)}
.fav{border:0;background:transparent;color:var(--faint);padding:2px;line-height:0}
.fav[aria-pressed="true"]{color:var(--gold)}
.fav svg{width:17px;height:17px}
.sample-badge{position:absolute;top:8px;right:10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.empty{padding:40px 24px;border:1px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);font-size:17px;margin-bottom:6px}
.empty .btn{margin-top:14px}

/* ---------- dashboard ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-title{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.span-12{grid-column:span 12}.span-7{grid-column:span 7}.span-5{grid-column:span 5}
.medium-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.medium{position:relative;overflow:hidden;padding:18px 18px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:border-color .15s}
.medium:hover{border-color:var(--c)}
.medium::before{content:"";position:absolute;inset:-40% -20% auto auto;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%)}
.medium h3{font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--c);position:relative}
.medium .big{font-family:var(--f-mono);font-size:32px;font-weight:700;margin-top:10px;position:relative}
.medium .big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.medium .row{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px;position:relative;flex-wrap:wrap}
.medium .row b{color:var(--fg);font-family:var(--f-mono)}
.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.list-row:first-child{border-top:0;padding-top:0}
.list-row .poster{width:38px;height:52px;font-size:12px;border-radius:6px}
.list-row .grow{flex:1;min-width:0}
.list-row .t{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;color:var(--muted);margin-bottom:18px}
.banner b{color:var(--fg)}
.banner .grow{flex:1 1 260px}

/* ---------- spin ---------- */
.spin-window{position:relative;height:118px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:14px 16px;overflow:hidden;margin-bottom:12px}
.spin-window .poster{width:62px;height:88px}
.spin-window.rolling .spin-text{filter:blur(.4px);opacity:.8}
.spin-text{min-width:0}
.spin-text .t{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.spin-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- discover ---------- */
.dna{display:flex;flex-direction:column;gap:9px}
.dna-row{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.dna-row .bar{height:8px}
.dna-row .bar i{background:linear-gradient(90deg,var(--accent),var(--anime))}
.dna-row span:last-child{text-align:right;color:var(--muted)}
.rec{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-width:0}
.rec-top{display:flex;gap:14px;align-items:flex-start}
.match{margin-left:auto;text-align:right;flex:none}
.match b{display:block;font-family:var(--f-mono);font-size:20px;color:var(--fg)}
.match span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.why{font-size:13px;color:var(--muted);border-left:2px solid var(--c);padding-left:10px}
.why b{color:var(--fg);font-weight:600}
.rec-actions{display:flex;gap:8px;flex-wrap:wrap}
.type-pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}

/* ---------- backup ---------- */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.note{font-size:13px;color:var(--muted)}
.note code{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);padding:1px 6px;border-radius:5px;color:var(--fg)}
.radio-row{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.radio-row label{display:flex;gap:7px;align-items:center;cursor:pointer}
.file-drop{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border:1px dashed var(--faint);border-radius:10px;color:var(--muted);cursor:pointer;text-align:center;font-size:14px}
.file-drop:hover,.file-drop.over{border-color:var(--accent);color:var(--fg)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,4,10,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 4vh) 16px 24px;overflow-y:auto}
.modal{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.modal-head h2{font-family:var(--f-display);font-size:18px;font-weight:700}
.form-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.c6{grid-column:span 6}.c3{grid-column:span 3}.c2{grid-column:span 2}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pip{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-family:var(--f-mono);font-weight:700;font-size:13px}
.pip.on{background:color-mix(in srgb,var(--gold) 22%,transparent);border-color:var(--gold);color:var(--gold)}
.modal-foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.modal-foot .spacer{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;padding:10px 18px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:700;font-size:14px;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- responsive ---------- */
@media (max-width:1100px){.span-7,.span-5{grid-column:span 12}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:40;flex-direction:row;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px)}
  .brand,.nav-sep,.rail-foot{display:none}
  .nav-btn{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:10.5px;text-align:center;justify-content:center}
  .nav-btn .dot{display:none}
  .main{padding-block:20px 110px}
  .mobile-brand{display:flex!important}
  .medium-strip{grid-template-columns:minmax(0,1fr)}
  .two{grid-template-columns:minmax(0,1fr)}
  .toolbar .select{flex:1 1 140px}
}
@media (max-width:520px){
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c6,.c3{grid-column:span 2}.c2{grid-column:span 1}
  .grid{grid-template-columns:minmax(0,1fr)}
  .dna-row{grid-template-columns:90px minmax(0,1fr) 34px}
}
.mobile-brand{display:none;align-items:center;gap:10px;margin-bottom:18px}

/* ---------- live discover + settings (v2) ---------- */
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.offline-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px}
.lcard{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-width:0;align-items:start}
.lposter{position:relative;width:104px;max-width:100%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surface-3);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--muted)}
.lposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.live-badge{position:absolute;left:5px;bottom:5px;font-size:9px;font-weight:800;letter-spacing:.1em;padding:3px 5px;border-radius:5px;background:rgba(12,10,18,.88);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);white-space:nowrap}
.lbody{min-width:0;display:flex;flex-direction:column;gap:7px}
.ltitle{font-weight:700;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.overview{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.overview.open{display:block;-webkit-line-clamp:unset}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:12.5px;padding:0;align-self:flex-start}
.live-status{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}
.live-status b{color:var(--fg)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pulse 2s infinite}
.pulse.cached{background:var(--gold);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.notes{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.notes p{margin:0;font-size:12.5px;color:var(--muted);padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:6px}
@keyframes shimmer{to{background-position:-200% 0}}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.panel.err{border-color:color-mix(in srgb,var(--movie) 55%,var(--line))}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.frow .field{flex:1 1 130px}
.chip:disabled{opacity:.4;cursor:not-allowed}
.attrib{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.attrib img{height:14px;width:auto;display:block}
.attrib a{color:var(--muted)}
.keyrow{display:flex;gap:8px;flex-wrap:wrap}
.keyrow .input{flex:1 1 260px;font-family:var(--f-mono);font-size:13px}
.mb-actions{margin-left:auto;display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.icon-btn svg{width:18px;height:18px}
.steps{margin:0;padding-left:20px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.steps b{color:var(--fg)}

const CATALOG = CATALOG_RAW.map(r=>({type:r[0],title:r[1],year:r[2],genres:r[3].split(" "),
  total: r[0]==="anime"?r[4]:null, runtime: r[0]==="movie"?r[4]:null}));

function sampleItems(){
  const t = Date.now();
  const s = (type,title,year,genres,o) => Object.assign(blank(type),{title,year,genres:genres.split(" "),sample:true,added:t,updated:t},o);
  return [
    s("anime","Death Note",2006,"psychological thriller mystery supernatural",{status:"done",rating:9,progress:37,total:37,fav:true,updated:t-9e6}),
    s("anime","Jujutsu Kaisen",2020,"action supernatural dark-fantasy",{status:"active",rating:8,progress:14,total:24,updated:t-1e6}),
    s("anime","Made in Abyss",2017,"adventure dark-fantasy drama mystery",{status:"done",rating:9,progress:13,total:13,updated:t-8e6}),
    s("anime","Frieren: Beyond Journey's End",2023,"fantasy adventure drama slice-of-life",{status:"planned",total:28,updated:t-5e6}),
    s("movie","Hereditary",2018,"horror psychological supernatural drama",{status:"done",rating:9,runtime:127,fav:true,updated:t-7e6}),
    s("movie","The Conjuring",2013,"horror supernatural",{status:"done",rating:7,runtime:112,updated:t-6e6}),
    s("movie","Midsommar",2019,"horror folk-horror psychological",{status:"planned",runtime:148,updated:t-4e6}),
    s("movie","Talk to Me",2022,"horror supernatural",{status:"planned",runtime:95,updated:t-3e6}),
    s("game","Silent Hill 2",2024,"horror psychological survival",{status:"active",rating:9,hours:11,platform:"PS5",updated:t-2e6}),
    s("game","Elden Ring",2022,"rpg soulslike open-world dark-fantasy",{status:"done",rating:10,hours:124,platform:"PC",fav:true,updated:t-1e7}),
    s("game","Stardew Valley",2016,"cozy slice-of-life rpg",{status:"paused",rating:7,hours:30,platform:"Switch",updated:t-1.1e7}),
    s("game","Alan Wake 2",2023,"horror psychological mystery story-rich",{status:"planned",platform:"PC",updated:t-2.5e6})
  ];
}

/* ===================== store ===================== */
let memOnly = false;
let store = {version:1, items:[], settings:{dismissed:[]}};
function blank(type){return {id:uid(),type,title:"",year:null,genres:[],status:"planned",rating:null,progress:0,total:null,hours:0,runtime:null,platform:"",notes:"",fav:false,sample:false,poster:null,ext:null,added:Date.now(),updated:Date.now()}}
function uid(){return "n"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){
  let raw=null;
  try{ raw = localStorage.getItem(KEY); }catch(e){ memOnly = true; }
  if(raw){
    try{ const d = JSON.parse(raw); store.items = (d.items||[]).map(clean).filter(Boolean); store.settings = Object.assign({dismissed:[]}, d.settings||{}); return; }catch(e){}
  }
  store.items = sampleItems();
  save();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); memOnly=false; }catch(e){ memOnly = true; }
  const n = document.getElementById("storageNote");
  if(n) n.textContent = memOnly ? "Storage blocked: export to keep data" : "Saved in this browser";
}
function clean(x){
  if(!x || typeof x!=="object" || !TYPES[x.type] || typeof x.title!=="string" || !x.title.trim()) return null;
  const b = blank(x.type);
  const num = (v,min,max)=>{const n=Number(v); return Number.isFinite(n)?Math.min(max,Math.max(min,n)):null};
  b.id = typeof x.id==="string"&&x.id ? x.id : uid();
  b.title = x.title.trim().slice(0,160);
  b.year = num(x.year,1900,2100); if(b.year!==null) b.year=Math.round(b.year);
  b.genres = Array.isArray(x.genres)? x.genres.map(g=>String(g).toLowerCase().trim().replace(/\s+/g,"-")).filter(Boolean).slice(0,12) : [];
  b.status = TYPES[x.type].st[x.status] ? x.status : "planned";
  b.rating = x.rating==null||x.rating==="" ? null : num(x.rating,1,10);
  b.progress = num(x.progress,0,99999)||0;
  b.total = x.total==null||x.total==="" ? null : num(x.total,1,99999);
  b.hours = num(x.hours,0,99999)||0;
  b.runtime = x.runtime==null||x.runtime==="" ? null : num(x.runtime,1,1000);
  b.platform = typeof x.platform==="string"? x.platform.slice(0,40):"";
  b.notes = typeof x.notes==="string"? x.notes.slice(0,2000):"";
  b.fav = !!x.fav; b.sample = !!x.sample;
  b.poster = typeof x.poster==="string" && POSTER_OK.test(x.poster) ? x.poster.slice(0,300) : null;
  b.ext = x.ext && (x.ext.src==="tmdb"||x.ext.src==="mal") && Number.isFinite(+x.ext.id) ? {src:x.ext.src,id:+x.ext.id} : null;
  b.added = num(x.added,0,9e15)||Date.now(); b.updated = num(x.updated,0,9e15)||b.added;
  return b;
}
const byId = id => store.items.find(i=>i.id===id);
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,"");

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function initials(t){const w=t.replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(Boolean);return ((w[0]||"?")[0]+(w[1]?w[1][0]:(w[0]||"")[1]||"")).toUpperCase()}
function poster(item){
  const T=TYPES[item.type], h=hash(item.title), shift=(h%50)-25, ang=90+(h%90);
  const bg=`linear-gradient(${ang}deg, hsl(${(T.hue+shift+360)%360} 55% 16%), hsl(${(T.hue+shift/2+360)%360} 70% 38%))`;
  const img = item.poster && POSTER_OK.test(item.poster) ? `<img src="${esc(item.poster)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
  return `<div class="poster" style="background:${bg}" aria-hidden="true">${esc(initials(item.title))}${img}</div>`;
}
function ratingHTML(r){return r==null?`<span class="rating" style="color:var(--faint)">unrated</span>`:`<span class="rating">${r}<small>/10</small></span>`}
function unitLine(i){
  if(i.type==="anime") return `<span class="mono">EP ${i.progress}${i.total?"/"+i.total:""}</span>`;
  if(i.type==="game") return `<span class="mono">${i.hours} HRS</span>${i.platform?`<span>${esc(i.platform)}</span>`:""}`;
  return i.runtime?`<span class="mono">${i.runtime} MIN</span>`:"";
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200)}
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function relTime(ts){const d=(Date.now()-ts)/864e5;if(d<1)return"today";if(d<2)return"yesterday";if(d<30)return Math.floor(d)+" days ago";return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"})}

/* ===================== state ===================== */
let view = "home";
const filters = {anime:{q:"",status:"all",genres:[],sort:"updated"},movie:{q:"",status:"all",genres:[],sort:"updated"},game:{q:"",status:"all",genres:[],sort:"updated"}};
const disc = {type:"all", mood:null, seed:1};
const spin = {type:"all", genre:"any", current:null};
try{ const v=sessionStorage.getItem("nexus.view"); if(v) view=v; }catch(e){}

/* ===================== recommender ===================== */
function tasteProfile(){
  const w={}; let signals=0;
  for(const i of store.items){
    let d = 0;
    if(i.rating!=null){ d=(i.rating-6)/4; signals++; }
    else if(i.status==="done") d=.2;
    else if(i.status==="active") d=.3;
    else if(i.status==="dropped") d=-.5;
    if(i.fav) d+=.4;
    if(!d) continue;
    for(const g of i.genres) w[g]=(w[g]||0)+d;
  }
  return {w, signals};
}
function recommend(opts){
  const {w,signals} = tasteProfile();
  const owned = new Set(store.items.map(i=>i.type+":"+norm(i.title)));
  const dismissed = new Set(store.settings.dismissed||[]);
  const moodG = opts.mood ? MOODS[opts.mood] : null;
  const typeCount = {anime:0,movie:0,game:0}; store.items.forEach(i=>typeCount[i.type]++);
  const total = store.items.length||1;
  const pool = [];
  CATALOG.forEach(c=>{ const k=c.type+":"+norm(c.title); if(!owned.has(k)&&!dismissed.has(k)) pool.push({...c,src:"catalog",key:k}); });
  store.items.filter(i=>i.status==="planned").forEach(i=>pool.push({...i,src:"backlog",key:i.type+":"+norm(i.title)}));
  const rated = store.items.filter(i=>i.rating!=null&&i.rating>=7);
  const out = pool.filter(c=>opts.type==="all"||c.type===opts.type).map(c=>{
    let s=0; c.genres.forEach(g=>s+=(w[g]||0)); s/=Math.sqrt(Math.max(1,c.genres.length));
    let moodHits=0; if(moodG){ moodHits=c.genres.filter(g=>moodG.includes(g)).length; s+=moodHits*.6; if(!moodHits) s-=1; }
    s += (typeCount[c.type]/total)*.3;
    if(c.src==="backlog") s+=.25;
    s += ((hash(c.title+opts.seed)%1000)/1000-.5)*.35;
    let anchor=null, best=0;
    for(const r of rated){ if(r.title===c.title) continue; const sh=r.genres.filter(g=>c.genres.includes(g)); const v=sh.length*r.rating; if(sh.length&&v>best){best=v;anchor={item:r,shared:sh}} }
    const pct = Math.max(38,Math.min(99,Math.round(62+36*Math.tanh(s/1.6))));
    return {...c,score:s,pct,anchor,moodHits};
  }).sort((a,b)=>b.score-a.score);
  return {list:out.slice(0,opts.limit||9), signals, w};
}
function whyHTML(r, mood){
  if(r.src==="backlog" && !r.anchor) return `Already on your <b>${esc(TYPES[r.type].st.planned.toLowerCase())}</b> and it fits your taste.`;
  if(r.anchor) return `Because you rated <b>${esc(r.anchor.item.title)}</b> ${r.anchor.item.rating}/10. Shared: ${r.anchor.shared.slice(0,3).map(esc).join(", ")}.${r.src==="backlog"?" It's already in your list.":""}`;
  if(mood && r.moodHits) return `Matches the <b>${esc(mood)}</b> mood.`;
  return `Popular pick in genres you haven't rated yet.`;
}

/* ===================== rendering ===================== */
function setView(v){

  render(); window.scrollTo(0,0);
}
function render(){
  const m=$("#main");
  const head = `<div class="mobile-brand"><span class="brand-name" style="font-size:17px">NEXUS</span><span class="brand-sub" style="margin:0">Entertainment hub</span><span class="mb-actions"><button class="icon-btn" data-act="nav" data-view="backup" aria-label="Backup and restore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button><button class="icon-btn" data-act="nav" data-view="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button></span></div>`;
  if(view==="home") m.innerHTML = head+homeHTML();
  else if(TYPES[view]) { m.innerHTML = head+libraryShell(view); renderLibrary(view); }
  else if(view==="discover") m.innerHTML = head+discoverHTML();
  else if(view==="backup") m.innerHTML = head+backupHTML();
  else if(view==="live") { m.innerHTML = head+liveHTML(); paintLive(); if(live.status==="idle"||live.status==="error"||live.status==="nokey") liveLoad(false); }
  else if(view==="settings") m.innerHTML = head+settingsHTML();
  if(view==="home") paintSpin();
}

function homeHTML(){
  const it=store.items, samples=it.some(i=>i.sample);
  const by=t=>it.filter(i=>i.type===t), cnt=(t,s)=>by(t).filter(i=>i.status===s).length;
  const eps=by("anime").reduce((a,i)=>a+i.progress,0), hrs=by("game").reduce((a,i)=>a+i.hours,0);
  const mins=by("movie").filter(i=>i.status==="done").reduce((a,i)=>a+(i.runtime||0),0);
  const active=it.filter(i=>i.status==="active").sort((a,b)=>b.updated-a.updated).slice(0,5);
  const recent=it.filter(i=>i.rating!=null).sort((a,b)=>b.updated-a.updated).slice(0,5);
  const recs=recommend({type:"all",mood:null,seed:disc.seed,limit:3}).list;
  const hour=new Date().getHours(), greet=hour<5?"Late night":hour<12?"Morning":hour<17?"Afternoon":"Tonight";
  const med=(t,big,unit,a,b)=>`<div class="medium" style="--c:${TYPES[t].color}" data-act="nav" data-view="${t}" role="button" tabindex="0"><h3>${t==="movie"?"HORROR & MOVIES":TYPES[t].label.toUpperCase()}</h3><div class="big">${big}<small>${unit}</small></div><div class="row"><span><b>${cnt(t,"active")}</b> ${TYPES[t].st.active.toLowerCase()}</span><span><b>${cnt(t,"planned")}</b> ${TYPES[t].st.planned.toLowerCase()}</span><span><b>${cnt(t,"done")}</b> ${TYPES[t].st.done.toLowerCase()}</span></div></div>`;
  return `
  ${samples?`<div class="banner"><span class="grow"><b>You're looking at sample entries.</b> Edit them, add your own, or clear them all when you're ready.</span><button class="btn btn-sm" data-act="clearSamples">Clear samples</button><button class="btn btn-sm btn-primary" data-act="add" data-type="anime">Add your first title</button></div>`:""}
  ${memOnly?`<div class="banner"><span class="grow"><b>This browser is blocking storage here.</b> Changes last until you close the page. Use Backup to export, or open NEXUS in its own tab.</span></div>`:""}
  <div class="view-head"><div><div class="eyebrow">${greet} on NEXUS</div><h1 class="view-title">What are we getting into?</h1></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="add" data-type="anime">+ Anime</button><button class="btn" data-act="add" data-type="movie">+ Movie</button><button class="btn" data-act="add" data-type="game">+ Game</button></div></div>
  <div class="medium-strip" style="margin-bottom:16px">
    ${med("anime",eps,"episodes watched")}
    ${med("movie",Math.round(mins/60),"hours of horror")}
    ${med("game",hrs,"hours played")}
  </div>
  <div class="dash">
    <section class="panel span-7"><div class="panel-head"><h2 class="panel-title">Continue</h2><span class="note">${active.length} in progress</span></div>
      ${active.length?`<div class="list">${active.map(i=>`<div class="list-row" style="--c:${TYPES[i.type].color}">${poster(i)}<div class="grow"><div class="t" data-act="edit" data-id="${i.id}">${esc(i.title)}</div><div class="meta"><span class="type-pill">${TYPES[i.type].label}</span>${unitLine(i)}</div>${i.type==="anime"&&i.total?`<div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,i.progress/i.total*100)}%"></i></div>`:""}</div>${i.type==="anime"?`<button class="btn btn-sm" data-act="bump" data-id="${i.id}">+1 ep</button>`:i.type==="game"?`<button class="btn btn-sm" data-act="bump" data-id="${i.id}">+1 hr</button>`:`<button class="btn btn-sm" data-act="finish" data-id="${i.id}">Watched</button>`}</div>`).join("")}</div>`
      :`<div class="empty"><h3>Nothing in progress</h3>Spin the picker or start something from your list.</div>`}
    </section>
    <section class="panel span-5"><div class="panel-head"><h2 class="panel-title">Pick for me</h2><div class="seg" id="spinType">${["all","anime","movie","game"].map(t=>`<button data-act="spinType" data-v="${t}" aria-pressed="${spin.type===t}">${t==="all"?"All":TYPES[t].label}</button>`).join("")}</div></div>

function allGenres(type, plannedOnly){
  const s=new Set(); store.items.filter(i=>(!type||i.type===type)&&(!plannedOnly||i.status==="planned")).forEach(i=>i.genres.forEach(g=>s.add(g)));
  return [...s].sort();
}
function libraryShell(t){
  const T=TYPES[t], f=filters[t];
  return `<div class="view-head" style="--c:${T.color}"><div><div class="eyebrow">${store.items.filter(i=>i.type===t).length} titles</div><h1 class="view-title">${T.title}</h1></div><button class="btn btn-primary" data-act="add" data-type="${t}">+ Add ${T.label.toLowerCase()}</button></div>
  <div class="toolbar">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="input" id="q-${t}" data-filter="q" placeholder="Search titles, notes, platforms" value="${esc(f.q)}" aria-label="Search"></div>
    <select class="select" id="st-${t}" data-filter="status" aria-label="Status"><option value="all">All statuses</option>${STATUS_ORDER.map(s=>`<option value="${s}" ${f.status===s?"selected":""}>${T.st[s]}</option>`).join("")}</select>
    <select class="select" id="so-${t}" data-filter="sort" aria-label="Sort"><option value="updated" ${f.sort==="updated"?"selected":""}>Recently updated</option><option value="rating" ${f.sort==="rating"?"selected":""}>Highest rated</option><option value="title" ${f.sort==="title"?"selected":""}>Title A–Z</option><option value="year" ${f.sort==="year"?"selected":""}>Newest release</option></select>
  </div>
  <div class="chips" id="chips" style="--c:${T.color}"></div>
  <div id="grid"></div>`;
}
function renderLibrary(t){
  const T=TYPES[t], f=filters[t];
  const gs=allGenres(t);
  f.genres=f.genres.filter(g=>gs.includes(g));
  $("#chips").innerHTML = gs.length? gs.map(g=>`<button class="chip" data-act="genre" data-g="${esc(g)}" aria-pressed="${f.genres.includes(g)}">${esc(g)}</button>`).join("") + (f.genres.length?`<button class="chip" data-act="genreClear">Clear</button>`:"") : "";
  const q=f.q.toLowerCase().trim();
  let items=store.items.filter(i=>i.type===t)
    .filter(i=>f.status==="all"||i.status===f.status)
    .filter(i=>f.genres.every(g=>i.genres.includes(g)))
    .filter(i=>!q||(i.title+" "+i.notes+" "+i.platform+" "+i.genres.join(" ")).toLowerCase().includes(q));
  const sorters={updated:(a,b)=>b.updated-a.updated,rating:(a,b)=>(b.rating??-1)-(a.rating??-1),title:(a,b)=>a.title.localeCompare(b.title),year:(a,b)=>(b.year??0)-(a.year??0)};
  items.sort(sorters[f.sort]);
  const g=$("#grid");
  if(!items.length){
    const none=!store.items.some(i=>i.type===t);
    g.innerHTML=`<div class="empty"><h3>${none?`Your ${T.label.toLowerCase()} list is empty`:"No titles match these filters"}</h3>${none?"Add something you're watching, finished, or want to get to.":"Try another genre or clear the search."}<br><button class="btn ${none?"btn-primary":""}" data-act="${none?"add":"resetFilters"}" data-type="${t}">${none?"+ Add "+T.label.toLowerCase():"Reset filters"}</button></div>`;
    return;
  }
  g.innerHTML=`<div class="grid">${items.map(i=>cardHTML(i)).join("")}</div>`;
}
function cardHTML(i){
  const T=TYPES[i.type];
  const prog = i.type==="anime"&&i.total ? `<div class="bar"><i style="width:${Math.min(100,i.progress/i.total*100)}%"></i></div>` : "";
  const quick = i.status==="active" ? (i.type==="anime"?`<button class="btn btn-sm" data-act="bump" data-id="${i.id}">+1 ep</button>`:i.type==="game"?`<button class="btn btn-sm" data-act="bump" data-id="${i.id}">+1 hr</button>`:"") : i.status==="planned"?`<button class="btn btn-sm" data-act="start" data-id="${i.id}">Start</button>`:"";
  return `<article class="card" style="--c:${T.color}" data-act="edit" data-id="${i.id}" tabindex="0" aria-label="${esc(i.title)}">
    ${i.sample?`<span class="sample-badge">Sample</span>`:""}
    ${poster(i)}
    <div class="card-body">
      <div class="card-title">${esc(i.title)}</div>
      <div class="meta">${i.year?`<span>${i.year}</span>`:""}${unitLine(i)}</div>
      <span class="status" data-s="${i.status}">${T.st[i.status]}</span>
      ${prog}
      <div class="tags">${i.genres.slice(0,3).map(g=>`<span class="tag">${esc(g)}</span>`).join("")}</div>
      <div class="card-foot">${ratingHTML(i.rating)}<span class="spacer"></span>${quick}<button class="fav" data-act="fav" data-id="${i.id}" aria-pressed="${i.fav}" aria-label="Favourite"><svg viewBox="0 0 24 24" fill="${i.fav?"currentColor":"none"}" stroke="currentColor" stroke-width="2"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg></button></div>
    </div></article>`;
}

    <div class="tags">${r.genres.map(g=>`<span class="tag ${hit.includes(g)?"hit":""}">${esc(g)}</span>`).join("")}</div>
    <div class="why">${whyHTML(r,disc.mood)}</div>

function exportJSON(){return JSON.stringify({app:"NEXUS",version:1,exported:new Date().toISOString(),items:store.items,settings:store.settings},null,2)}

/* ===================== spin ===================== */
function spinPool(){
  return store.items.filter(i=>i.status==="planned"&&(spin.type==="all"||i.type===spin.type)&&(spin.genre==="any"||i.genres.includes(spin.genre)));
}
function paintSpin(item){
  const w=$("#spinWin"); if(!w) return;
  const pool=spinPool();
  if(item===undefined) item = spin.current && byId(spin.current) && spinPool().some(p=>p.id===spin.current) ? byId(spin.current) : null;
  if(!item){
    w.style.removeProperty("--c");
    w.innerHTML = pool.length ? `<div class="spin-text"><div class="eyebrow">${pool.length} in the pool</div><div class="t">Can't decide? Spin.</div></div>` : `<div class="spin-text"><div class="eyebrow">Pool is empty</div><div class="t" style="font-size:15px">Add titles with status “${spin.type==="all"?"Plan to watch / Backlog":esc(TYPES[spin.type].st.planned)}”.</div></div>`;
    const s=$("#spinStart"); if(s) s.hidden=true; return;
  }
  w.style.setProperty("--c",TYPES[item.type].color);
  w.innerHTML = `${poster(item)}<div class="spin-text"><span class="type-pill" style="color:${TYPES[item.type].color}">${TYPES[item.type].label}</span><div class="t">${esc(item.title)}</div><div class="meta" style="margin-top:4px">${item.year?`<span>${item.year}</span>`:""}${unitLine(item)}<span>${item.genres.slice(0,2).map(esc).join(" · ")}</span></div></div>`;
}
function doSpin(){
  const pool=spinPool(); if(!pool.length){ toast("Nothing to pick from yet"); return; }
  const w=$("#spinWin"), btn=$("#spinStart");
  const pick=pool[Math.floor(Math.random()*pool.length)];
  const finish=()=>{ w.classList.remove("rolling"); spin.current=pick.id; paintSpin(pick); if(btn) btn.hidden=false; };
  if(reduced||pool.length<2){ finish(); return; }
  w.classList.add("rolling"); let n=0, delay=55;
  const step=()=>{ paintSpin(pool[n++%pool.length]); delay*=1.13; if(delay<300) setTimeout(step,delay); else finish(); };
  step();
}

    <div class="form-grid">

function doImport(){
  const msg=$("#importMsg"), txt=$("#importBox").value.trim();
  if(!txt){ msg.textContent="Choose a file or paste backup JSON first."; return; }
  let data; try{ data=JSON.parse(txt); }catch(err){ msg.textContent="That isn't valid JSON. Check that you copied the whole backup, from the first { to the last }."; return; }
  const arr=Array.isArray(data)?data:Array.isArray(data.items)?data.items:null;
  if(!arr){ msg.textContent="No titles found. A NEXUS backup has an \"items\" list."; return; }
  const items=arr.map(clean).filter(Boolean);
  const skipped=arr.length-items.length;
  const replace=$("#im-replace").checked;
  if(replace){ store.items=items; if(data.settings) store.settings=Object.assign({dismissed:[]},data.settings); }
  else{
    let added=0, updated=0;
    for(const it of items){
      const ex=store.items.findIndex(x=>x.id===it.id||(x.type===it.type&&norm(x.title)===norm(it.title)));
      if(ex<0){ store.items.push(it); added++; } else if(it.updated>=store.items[ex].updated){ store.items[ex]=Object.assign(it,{id:store.items[ex].id}); updated++; }
    }
    save(); render(); toast(`Imported: ${added} new, ${updated} updated${skipped?`, ${skipped} skipped`:""}`); return;
  }
  save(); render(); toast(`Restored ${items.length} titles${skipped?`, ${skipped} skipped`:""}`);
}

const TMDB_KEY_STORE = "nexus.tmdbKey";      // kept apart from nexus.v1 so it is never exported
const CACHE_STORE = "nexus.cache.v1";        // API responses only; safe to clear any time
const TTL_LIST = 6*36e5, TTL_META = 7*864e5, CACHE_MAX = 30;
const TMDB_LOGO = "https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg";

/* --- key + cache storage (separate keys; never touches nexus.v1) --- */
let memKey = "", memCache = {};
function getKey(){ try{ const k=localStorage.getItem(TMDB_KEY_STORE); return (k==null?memKey:k).trim(); }catch(e){ return memKey; } }
function setKey(k){ memKey=k; try{ k ? localStorage.setItem(TMDB_KEY_STORE,k) : localStorage.removeItem(TMDB_KEY_STORE); }catch(e){} }
function cacheAll(){ try{ const r=localStorage.getItem(CACHE_STORE); return r?JSON.parse(r):memCache; }catch(e){ return memCache; } }
function cacheGet(k,ttl){ const c=cacheAll()[k]; return c && Date.now()-c.t<ttl ? c : null; }
function cachePut(k,data){
  const all=cacheAll(); all[k]={t:Date.now(),data};
  Object.keys(all).sort((a,b)=>all[b].t-all[a].t).slice(CACHE_MAX).forEach(x=>delete all[x]);
  memCache=all;
  try{ localStorage.setItem(CACHE_STORE,JSON.stringify(all)); }catch(e){ try{ localStorage.removeItem(CACHE_STORE); }catch(_){} }
}
function cacheClear(){ memCache={}; try{ localStorage.removeItem(CACHE_STORE); }catch(e){} }

/* --- HTTP --- */
class ApiError extends Error{ constructor(msg,code){ super(msg); this.code=code; } }
async function getJSON(url,headers){
  const ctl = typeof AbortController!=="undefined" ? new AbortController() : null;
  const timer = setTimeout(()=>ctl&&ctl.abort(),12000);
  let res;
  try{ res = await fetch(url,{headers:headers||{},signal:ctl?ctl.signal:undefined}); }
  catch(e){ throw new ApiError(e&&e.name==="AbortError"?"timeout":"network", e&&e.name==="AbortError"?"timeout":"net"); }
  finally{ clearTimeout(timer); }
  if(!res.ok) throw new ApiError("http "+res.status,res.status);
  try{ return await res.json(); }catch(e){ throw new ApiError("parse","parse"); }
}
async function tmdb(path,params,o){
  o=o||{}; const key=getKey(); if(!key) throw new ApiError("nokey","nokey");
  const qs=new URLSearchParams(Object.assign({language:"en-US"},params||{}));
  const ck="tmdb:"+path+"?"+qs;                      // cache key never contains the API key
  if(!o.force){ const c=cacheGet(ck,o.ttl||TTL_LIST); if(c) return {data:c.data,cachedAt:c.t}; }
  const headers={accept:"application/json"};
  if(/^eyJ/.test(key)) headers.Authorization="Bearer "+key; else qs.set("api_key",key);
  const raw=await getJSON("https://api.themoviedb.org/3"+path+"?"+qs,headers);
  const data=o.map?o.map(raw):raw; if(!o.noCache) cachePut(ck,data); return {data,cachedAt:null};
}
let jQueue=Promise.resolve(), jLast=0;
async function jikan(path,params,o){
  o=o||{}; const qs=new URLSearchParams(params||{}); const ck="jikan:"+path+"?"+qs;
  if(!o.force){ const c=cacheGet(ck,o.ttl||TTL_LIST); if(c) return {data:c.data,cachedAt:c.t}; }
  const url="https://api.jikan.moe/v4"+path+(String(qs)?"?"+qs:"");
  const run=async()=>{                                 // Jikan allows ~3 req/s: space calls 450ms, retry once on 429
    const wait=jLast+450-Date.now(); if(wait>0) await sleep(wait); jLast=Date.now();
    try{ return await getJSON(url); }catch(e){ if(e.code===429){ await sleep(1600); jLast=Date.now(); return await getJSON(url); } throw e; }
  };
  const p=jQueue.then(run,run); jQueue=p.catch(()=>{});
  const data=o.map?o.map(await p):await p; cachePut(ck,data); return {data,cachedAt:null};
}

/* --- mapping API results into one shape --- */
const GENRE_ALIAS = {"science-fiction":"sci-fi","sci-fi":"sci-fi","suspense":"thriller","tv-movie":null,"award-winning":null};
function normGenre(n){ const g=String(n).toLowerCase().trim().replace(/\s+/g,"-"); return g in GENRE_ALIAS ? GENRE_ALIAS[g] : g; }
function mapTmdb(m,gmap){
  const title=m.title||m.original_title||"Untitled";
  return {src:"tmdb",id:m.id,type:"movie",title,altTitle:m.original_title&&m.original_title!==title?m.original_title:"",
    year:+(m.release_date||"").slice(0,4)||null,date:m.release_date||"",overview:String(m.overview||"").slice(0,700),
    poster:m.poster_path?"https://image.tmdb.org/t/p/w342"+m.poster_path:null,
    score:m.vote_count?Math.round(m.vote_average*10)/10:null,votes:m.vote_count||0,
    gids:m.genre_ids||[],genres:(m.genre_ids||[]).map(id=>gmap[id]).filter(Boolean),
    url:"https://www.themoviedb.org/movie/"+m.id};
}
function mapJikan(a){
  const img=(a.images&&((a.images.webp&&a.images.webp.large_image_url)||(a.images.jpg&&(a.images.jpg.large_image_url||a.images.jpg.image_url))))||null;
  const from=a.aired&&a.aired.prop&&a.aired.prop.from;
  const title=a.title_english||a.title||"Untitled";
  const g=[].concat(a.genres||[],a.themes||[]).map(x=>normGenre(x.name)).filter(Boolean);
  return {src:"mal",id:a.mal_id,type:"anime",title,altTitle:a.title&&a.title!==title?a.title:"",
    year:a.year||(from&&from.year)||null,date:(a.aired&&a.aired.string)||"",airing:a.status||"",
    overview:String(a.synopsis||"").slice(0,700),poster:img&&POSTER_OK.test(img)?img:null,
    score:typeof a.score==="number"?a.score:null,votes:a.scored_by||0,episodes:a.episodes||null,
    genres:[...new Set(g)],url:a.url||("https://myanimelist.net/anime/"+a.mal_id)};
}

/* --- build the request for the current tab/mode/filters --- */
async function liveFetch(force,page){
  const t=live.tab, f=live.f[t], mode=live.mode[t], q=live.q[t].trim(), notes=[];
  const active=LIVE_FILTERS.filter(x=>f.on.includes(x.id));
  const year=/^\d{4}$/.test(f.year)&&+f.year>=1900&&+f.year<=2100?f.year:"";
  if(f.year&&!year) notes.push("Year must be four digits, like 2024. It was ignored.");
  const minR=f.min?+f.min:0;
  if(t==="movie"){
    const genres=await tmdbGenres(); const gmap={}, gid={};
    genres.forEach(g=>{ gmap[g.id]=normGenre(g.name); gid[g.name.toLowerCase()]=g.id; });
    const map=d=>({items:(d.results||[]).map(m=>mapTmdb(m,gmap)),hasMore:(d.page||1)<Math.min(d.total_pages||1,500)});
    const wantG=active.filter(x=>x.movie.genre).map(x=>gid[x.movie.genre.toLowerCase()]).filter(Boolean);
    const kwF=active.filter(x=>x.movie.keyword);
    if(mode==="search"){
      if(!q) return {items:[],hasMore:false,empty:"search",notes};
      const p={query:q,include_adult:"false",page}; if(year) p.primary_release_year=year;
      const r=await tmdb("/search/movie",p,{force,map});
      let items=r.data.items.filter(i=>wantG.every(g=>i.gids.includes(g)));
      if(minR) items=items.filter(i=>i.score!=null&&i.score>=minR);
      if(kwF.length) notes.push(`${kwF.map(x=>x.label).join(" and ")} can't be applied to a text search, because TMDB search doesn't filter by keyword. Clear the search box and use Trending or Recent releases to browse with ${kwF.length>1?"them":"it"}.`);
      if(wantG.length||minR) notes.push("Genre and rating filters are applied to the search results on this page.");

    }
    const unfiltered=!active.length&&!year&&!minR;
    if(mode==="trending"&&unfiltered){
      const r=await tmdb("/trending/movie/week",{page},{force,map});
      return {items:r.data.items,hasMore:r.data.hasMore,cachedAt:r.cachedAt,notes,source:"TMDB trending this week"};
    }
    const p={include_adult:"false",include_video:"false",sort_by:"popularity.desc",page};
    if(wantG.length) p.with_genres=wantG.join(",");
    const kwIds=[];
    for(const x of kwF){ const id=await tmdbKeyword(x.movie.keyword); if(id) kwIds.push({id,x}); else notes.push(`TMDB returned no “${x.movie.keyword}” keyword, so that filter was skipped.`); }
    if(kwIds.length) p.with_keywords=kwIds.map(k=>k.id).join(",");
    if(minR){ p["vote_average.gte"]=String(minR); p["vote_count.gte"]="50"; notes.push("The rating filter only counts movies with at least 50 TMDB votes."); }
    let source;
    if(mode==="recent"){
      if(year){ p.primary_release_year=year; notes.push(`Showing ${year} releases. The year filter replaces the last-90-days window.`); }
      else { p["primary_release_date.gte"]=isoDays(-90); p["primary_release_date.lte"]=isoDays(0); }
      source=year?`TMDB releases from ${year}, most popular first`:"TMDB releases from the last 90 days, most popular first";
    } else {
      if(year) p.primary_release_year=year;
      notes.push("TMDB's trending list can't be filtered, so filtered results come from its most-popular list instead.");
      source="TMDB most popular (filtered)";
    }
    const r=await tmdb("/discover/movie",p,{force,map});
    const items=r.data.items.map(i=>Object.assign({},i,{genres:[...new Set(i.genres.concat(kwIds.map(k=>k.x.tag)))]}));
    return {items,hasMore:r.data.hasMore,cachedAt:r.cachedAt,notes,source};
  }
  /* anime via Jikan */
  const gl=await jikanGenres(); const gid={}; gl.forEach(g=>{ gid[g.name.toLowerCase()]=g.id; });
  const unsupported=active.filter(x=>!x.anime);
  if(unsupported.length) notes.push(`MyAnimeList has no ${unsupported.map(x=>x.label.toLowerCase()).join(" or ")} tag, so ${unsupported.length>1?"those filters are":"that filter is"} ignored for anime.`);
  const aF=active.filter(x=>x.anime);
  const missing=aF.filter(x=>!gid[x.anime.genre.toLowerCase()]);
  if(missing.length) notes.push(`MyAnimeList didn't list ${missing.map(x=>x.anime.genre).join(", ")} as a genre, so ${missing.length>1?"those were":"that was"} skipped.`);
  const ag=aF.map(x=>gid[x.anime.genre.toLowerCase()]).filter(Boolean);
  const map=d=>{ const seen=new Set(); return {items:(d.data||[]).filter(a=>a&&!seen.has(a.mal_id)&&seen.add(a.mal_id)).map(mapJikan),hasMore:!!(d.pagination&&d.pagination.has_next_page)}; };
  const p={sfw:"true",page:String(page),limit:"24"};
  if(mode==="season"){
    const r=await jikan("/seasons/now",p,{force,map});
    const names=aF.filter(x=>gid[x.anime.genre.toLowerCase()]).map(x=>normGenre(x.anime.genre));
    let items=r.data.items;
    if(names.length) items=items.filter(i=>names.every(n=>i.genres.includes(n)));
    if(minR) items=items.filter(i=>i.score!=null&&i.score>=minR);
    if(year) notes.push("This season's list only contains the current season, so the year filter is ignored here.");
    if(names.length||minR) notes.push("Filters are applied to this page of the season list. Load more to check further pages.");
    return {items,hasMore:r.data.hasMore,cachedAt:r.cachedAt,notes,source:"MyAnimeList, current season"};
  }
  const unfiltered=!ag.length&&!year&&!minR;
  if(mode==="popular"&&unfiltered){
    const r=await jikan("/top/anime",Object.assign({},p,{filter:"airing"}),{force,map});
    return {items:r.data.items,hasMore:r.data.hasMore,cachedAt:r.cachedAt,notes,source:"MyAnimeList top airing"};
  }
  if(mode==="search"&&!q) return {items:[],hasMore:false,empty:"search",notes};
  if(mode==="search") p.q=q;
  if(ag.length) p.genres=ag.join(",");
  if(minR) p.min_score=String(minR);
  if(year){ p.start_date=year+"-01-01"; p.end_date=year+"-12-31"; }
  let source=`MyAnimeList search for “${q}”`;
  if(mode==="popular"){ p.status="airing"; p.order_by="members"; p.sort="desc"; source="MyAnimeList currently airing, by members (filtered)"; }
  const r=await jikan("/anime",p,{force,map});
  return {items:r.data.items,hasMore:r.data.hasMore,cachedAt:r.cachedAt,notes,source};
}
function errMsg(e){
  const api=live.tab==="movie"?"TMDB":"Jikan (MyAnimeList)";
  if(e.code==="nokey") return "Add your TMDB API key in Settings to load live movies.";
  if(e.code===401) return live.tab==="movie"?"TMDB didn't accept your API key. Check it in Settings and try again.":"Jikan refused the request (401). Try Refresh in a minute.";
  if(e.code===404) return `${api} couldn't find that list (404). Try another mode or search.`;
  if(e.code===429) return `${api} says there have been too many requests in a short time. Wait a minute, then press Refresh.`;
  if(typeof e.code==="number"&&e.code>=500) return `${api} is having trouble right now (error ${e.code}). This is on their side; try Refresh in a few minutes.`;
  if(e.code==="timeout") return `${api} took too long to answer. Press Refresh to try again.`;
  if(e.code==="parse") return `${api} sent a response NEXUS couldn't read. Press Refresh to try again.`;
  return `Couldn't reach ${api}. Check your internet connection. If NEXUS is open inside a preview or a page that blocks outside requests, open it from your GitHub Pages link instead.`;
}
async function liveLoad(force,append){
  const id=++live.req, page=append?live.page+1:1;
  if(live.tab==="movie"&&!getKey()){ live.status="nokey"; live.results=[]; paintLive(); return; }
  live.status=append?"more":"loading"; live.error=null; if(!append){ live.results=[]; live.notes=[]; }
  paintLive();
  try{
    const r=await liveFetch(!!force,page); if(id!==live.req) return;
    const seen=new Set(live.results.map(x=>x.id));
    live.results=append?live.results.concat(r.items.filter(i=>!seen.has(i.id))):r.items;
    live.page=page; live.hasMore=!!r.hasMore; live.notes=r.notes||[]; live.source=r.source||""; live.empty=r.empty||null;
    live.cachedAt=r.cachedAt||null; live.fetchedAt=r.cachedAt||Date.now(); live.status="ok";
  }catch(e){ if(id!==live.req) return; live.status="error"; live.error=errMsg(e); }
  paintLive();
}

/* --- library matching: duplicates + explanations --- */
function findDup(r){
  return store.items.find(i=>i.ext&&i.ext.src===r.src&&i.ext.id===r.id) ||
    store.items.find(i=>i.type===r.type && (norm(i.title)===norm(r.title)||(r.altTitle&&norm(i.title)===norm(r.altTitle))) && (i.year==null||r.year==null||Math.abs(i.year-r.year)<=1));
}
function liveScore(r,prof,active){
  const n=Math.max(1,r.genres.length); let s=0; r.genres.forEach(g=>s+=(prof.w[g]||0)); s/=Math.sqrt(n);
  const hits=active.filter(x=>r.genres.includes(x.tag)).length; s+=hits*.3;
  return {s,pct:Math.max(38,Math.min(99,Math.round(62+36*Math.tanh(s/1.6)))),hits};
}
function liveWhy(r,dup,prof,sc,active){
  const parts=[];
  if(dup) parts.push(`In your library as <b>${esc(TYPES[dup.type].st[dup.status])}</b>${dup.rating!=null?`, rated ${dup.rating}/10`:""}. Adding again won't create a copy.`);
  const shared=it=>it.genres.filter(g=>r.genres.includes(g));
  let best=null,bv=0,worst=null,wv=0;
  for(const it of store.items){
    if(it===dup||it.rating==null) continue; const sh=shared(it); if(!sh.length) continue;
    if(it.rating>=7&&sh.length*it.rating>bv){ bv=sh.length*it.rating; best={it,sh}; }
    if(it.rating<=5&&sh.length*(6-it.rating)>wv){ wv=sh.length*(6-it.rating); worst={it,sh}; }
  }
  if(!dup){
    if(best) parts.push(`Because you rated <b>${esc(best.it.title)}</b> ${best.it.rating}/10. Shared: ${best.sh.slice(0,3).map(esc).join(", ")}.`);
    else if(sc.s<-.2&&worst) parts.push(`Ranks lower for you: it overlaps with <b>${esc(worst.it.title)}</b>, which you rated ${worst.it.rating}/10.`);
    else if(!prof.signals) parts.push(`Rate a few titles in your library and NEXUS will explain how this fits your taste.`);
    else parts.push(`Little overlap with what you've rated so far, so this is a chance to try something new.`);
  }
  const fh=active.filter(x=>r.genres.includes(x.tag));
  if(fh.length) parts.push(`Matches your filter${fh.length>1?"s":""}: ${fh.map(x=>x.label.toLowerCase()).join(", ")}.`);
  if(r.score!=null&&r.votes) parts.push(`${srcName(r.src)} users rate it ${r.score}/10.`);
  return parts.join(" ");
}
function fillMissing(i,r){
  const f=[];
  if(!i.poster&&r.poster&&POSTER_OK.test(r.poster)){ i.poster=r.poster; f.push("poster"); }
  if(!i.ext){ i.ext={src:r.src,id:r.id}; f.push(srcName(r.src)+" link"); }
  if(i.year==null&&r.year){ i.year=r.year; f.push("year"); }
  if(!i.genres.length&&r.genres.length){ i.genres=r.genres.slice(0,12); f.push("genres"); }
  if(i.type==="anime"&&i.total==null&&r.episodes){ i.total=r.episodes; f.push("episode count"); }
  return f;
}
async function liveAdd(r){
  if(!r) return;
  const dup=findDup(r);
  if(dup){
    const f=fillMissing(dup,r);
    if(f.length){ save(); toast(`Already in your library. Added ${f.join(", ")}; your rating, notes and progress are unchanged.`); }
    else toast("Already in your library. Nothing changed.");
    paintLive(); return;
  }
  const it=Object.assign(blank(r.type),{title:r.title,year:r.year,genres:r.genres.slice(0,12),poster:r.poster,ext:{src:r.src,id:r.id},total:r.type==="anime"?r.episodes:null});
  const saved=upsert(it); toast(`Added ${r.title} to ${TYPES[r.type].st.planned.toLowerCase()}`); paintLive();
  if(r.src==="tmdb"&&saved){
    try{ const d=await tmdb("/movie/"+r.id,{},{ttl:TTL_META,map:x=>({runtime:x.runtime||null})});
      const cur=byId(saved.id); if(cur&&cur.runtime==null&&d.data.runtime){ cur.runtime=d.data.runtime; save(); } }catch(e){}
  }
}

    <section class="panel stack"><h2 class="panel-title">TMDB API key</h2>
      <p class="note" style="margin:0" id="keyStatus">${k?`<b style="color:var(--ok)">Connected.</b> ${kind} ending in <code>${esc(k.slice(-4))}</code> is saved in this browser.`:"No key saved. Live movies need one; anime doesn't."}</p>
      <div class="keyrow"><input class="input" id="tmdbKeyIn" type="password" autocomplete="off" spellcheck="false" placeholder="${k?"Paste a new key to replace it":"Paste your TMDB API key or Read Access Token"}" aria-label="TMDB API key"><button class="btn" data-act="setShow" type="button">Show</button></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" data-act="setSave">Save key</button><button class="btn" data-act="setTest" ${k?"":"disabled"}>Test connection</button><button class="btn btn-danger" data-act="setRemove" ${k?"":"disabled"}>Remove key</button></div>
      <p class="note" style="margin:0" id="setMsg" role="status"></p>
      <ol class="steps"><li>Sign in at <b>themoviedb.org</b>, open your account <b>Settings → API</b>.</li><li>Request a free developer key for personal, non-commercial use.</li><li>Copy either the <b>API Key</b> or the <b>API Read Access Token</b> and paste it here.</li></ol>
      <p class="note" style="margin:0">The key is stored only in this browser (<code>${TMDB_KEY_STORE}</code>). It is not part of the website file or your GitHub repository, and it is left out of JSON backups. Anyone using this browser profile could read it, so don't save it on shared computers.</p>
    </section>
    <section class="panel stack"><h2 class="panel-title">Cache</h2>
      <p class="note" style="margin:0">Live lists are cached for 6 hours and genre lists for 7 days to keep NEXUS fast and within the APIs' rate limits. Refresh on the Live page always fetches fresh data.</p>
      <p class="note" style="margin:0"><b style="color:var(--fg)" id="cacheCount">${n}</b> cached response${n===1?"":"s"} in this browser.</p>
      <div><button class="btn" data-act="cacheClear">Clear cached API data</button></div>
      <h2 class="panel-title" style="margin-top:8px">Data sources</h2>
      <p class="note" style="margin:0">Movies: The Movie Database (TMDB). Anime: MyAnimeList, through the free, unofficial Jikan API (no key needed, about 3 requests per second). Clearing the cache never touches your library.</p>
    </section>
  </div>
  ${attribution()}`;
}

/* --- live + settings events --- */
const liveFind = k => live.results.find(r=>r.src+":"+r.id===k);
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  switch(el.dataset.act){
    case "liveTab": live.tab=el.dataset.v; live.status="idle"; live.results=[]; if(view!=="live") setView("live"); else render(); break;
    case "liveMode": live.mode[live.tab]=el.dataset.v; live.status="idle"; live.results=[]; render(); break;
    case "liveFilter": { if(el.disabled) break; const f=live.f[live.tab], id=el.dataset.v; f.on=f.on.includes(id)?f.on.filter(x=>x!==id):f.on.concat(id); el.setAttribute("aria-pressed",String(f.on.includes(id))); queueLive(); break; }
    case "liveClear": live.f[live.tab]={on:[],year:"",min:""}; live.status="idle"; render(); break;
    case "liveRefresh": liveLoad(true); break;
    case "liveMore": liveLoad(false,true); break;
    case "liveAdd": liveAdd(liveFind(el.dataset.k)); break;
    case "liveOv": { const p=document.getElementById("ov-"+el.dataset.k); if(p){ const o=p.classList.toggle("open"); el.textContent=o?"Show less":"Read more"; } break; }
    case "setShow": { const i=$("#tmdbKeyIn"); i.type=i.type==="password"?"text":"password"; el.textContent=i.type==="password"?"Show":"Hide"; break; }
    case "setSave": {
      const v=($("#tmdbKeyIn").value||"").trim(), msg=$("#setMsg");
      if(!v){ msg.textContent="Paste a key first."; break; }
      if(/\s/.test(v)){ msg.textContent="That key contains spaces. Copy it again from TMDB without extra text."; break; }
      setKey(v); cacheClear(); live.status="idle"; live.results=[]; render();
      $("#setMsg").textContent=/^[a-f0-9]{32}$/i.test(v)||/^eyJ/.test(v)?"Saved. Testing the connection…":"Saved, but it doesn't look like a TMDB key (32 characters) or token (starts with eyJ). Testing…";
      testKey(); break; }
    case "setTest": testKey(); break;
    case "setRemove": setKey(""); cacheClear(); live.status="idle"; live.results=[]; render(); toast("TMDB key removed from this browser"); break;
    case "cacheClear": cacheClear(); if(view==="settings") render(); toast("Cached API data cleared"); break;
  }
});
async function testKey(){
  const msg=$("#setMsg"); if(!msg) return;
  msg.textContent="Testing connection to TMDB…";
  try{ const r=await tmdb("/authentication",{},{force:true,noCache:true}); const m=$("#setMsg"); if(m) m.innerHTML=r.data&&r.data.success!==false?`<b style="color:var(--ok)">Connection works.</b> Live movies are ready.`:"TMDB answered but didn't confirm the key. Check it and try again."; }
  catch(e){ const m=$("#setMsg"); if(!m) return; m.textContent = e.code===401 ? "TMDB rejected this key. Check that you copied the whole API key or Read Access Token." : e.code==="net" ? "Couldn't reach TMDB from here. If this is a preview, try from your GitHub Pages link." : "TMDB test failed ("+(e.code||"unknown")+"). Try again in a minute."; }
}
document.addEventListener("change", e=>{
  const t=e.target; if(view!=="live") return;
  if(t.id==="liveYear"&&t.value.trim()!==live.f[live.tab].year){ live.f[live.tab].year=t.value.trim(); queueLive(); }
  if(t.id==="liveMin"){ live.f[live.tab].min=t.value; queueLive(); }
  if(t.id==="liveSort"){ live.sort=t.value; paintLive(); }
});
document.addEventListener("input", e=>{
  const t=e.target; if(view!=="live"||t.id!=="liveYear") return;
  const v=t.value.trim(); if(v===""||/^\d{4}$/.test(v)){ if(v!==live.f[live.tab].year){ live.f[live.tab].year=v; queueLive(); } }
});
document.addEventListener("submit", e=>{
  if(e.target.id!=="liveSearch") return; e.preventDefault();
  live.q[live.tab]=($("#liveQ").value||"").trim(); liveLoad(false);
});

/* ===================== boot ===================== */
load();
setView(TYPES[view]||["home","discover","backup","live","settings"].includes(view)?view:"home");
})();
</script>
</body>
</html>
